name: "💡 Feature Request"
description: Create a new ticket for a new feature request
title: "💡 [REQUEST] - <title>"
labels: [
  "enhancement"
]
body:
  - type: dropdown
    id: function
    attributes:
      label: "Function"
      description: Which product function does this belong to? This decides who owns the decision.
      options:
        - Troubleshooting / collectors
        - AI
        - Integrations
        - Notifications / tickets / optimize
        - UI / API / auth
        - Platform
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: "Who asked for this"
      description: Where the demand came from. "Our own judgement" is a valid and common answer — pick it rather than inventing a customer.
      options:
        - Customer — named account
        - Prospect — active deal
        - Sales / field feedback
        - Support — recurring ticket
        - Our own judgement
        - Internal / team need
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: Provide a brief explanation of the feature.
      placeholder: Describe in a few lines your feature request
    validations:
      required: true
  - type: textarea
    id: unblocks
    attributes:
      label: "What this unblocks"
      description: Name the account, deal, renewal or support load behind it — or say plainly that it is a bet on where the product should go. This is the main input to prioritisation.
      placeholder: |
        ex. Blocks the Acme renewal (Q3) — they cannot onboard 3 clusters without it.
        ex. No specific customer; we think multi-cluster estates are where the next 10 deals come from.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: "How we will know it worked"
      description: What changes after this ships, and what would tell us it did? A number is best; an observable behaviour is fine. "Users like it" is not.
      placeholder: |
        ex. Onboarding a second cluster takes under 5 minutes, measured on the next 3 trials.
        ex. Support tickets tagged 'cluster-connect' drop from ~8/week to under 2.
    validations:
      required: true
  - type: textarea
    id: tradeoff
    attributes:
      label: "What we are not doing instead"
      description: If this gets built this quarter, what slips? Naming the trade-off is the point — "nothing" is a legitimate answer if the work is genuinely small.
      placeholder: ex. Pushes the alert-grouping replay work out by ~2 weeks. Worth it because the renewal is at risk and grouping is not.
    validations:
      required: true
  - type: textarea
    id: basic_example
    attributes:
      label: "Basic Example"
      description: Indicate here some basic examples of your feature.
      placeholder: A few specific words about your feature request.
    validations:
      required: false
  - type: textarea
    id: drawbacks
    attributes:
      label: "Drawbacks"
      description: What are the drawbacks/impacts of your feature request?
      placeholder: Identify the drawbacks and impacts while being neutral on your feature request
    validations:
      required: false
  - type: textarea
    id: unresolved_question
    attributes:
      label: "Unresolved questions"
      description: What questions still remain unresolved?
      placeholder: Identify any unresolved issues.
    validations:
      required: false
  - type: input
    id: parent
    attributes:
      label: "Parent / epic"
      description: If this is one slice of a larger piece of work, link it here. Leave blank if it stands alone.
      placeholder: "#31200"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: "Related work"
      description: |
        Anything connected — issues, features, or PRs. One per line, starting with the relationship, so the link reads correctly from both ends:
        `Part of #123` · `Blocked by #123` · `Blocks #123` · `Related to #123` · `Duplicates #123` · `Supersedes #123`
        Typing `#` autocompletes issue and PR titles.
      placeholder: |
        Part of #31200
        Blocked by #32014 — needs canonical fetch_logs first
        Related to #30299 — same flow-source pattern
    validations:
      required: false
