name: "🐛 Bug Report"
description: Create a new ticket for a bug.
title: "🐛 [BUG] - <title>"
labels: [
  "bug"
]
body:
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: Where was this seen? Pick the highest environment it reproduces in.
      options:
        - Production
        - QA / Test
        - Dev
        - Local only
        - Not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: Please enter an explicit description of your issue
      placeholder: Short and explicit description of your incident...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "Impact"
      description: Who is affected, how badly, and since when? This is the main input to triage priority.
      placeholder: ex. All users on tenant X since the 12 Aug deploy; blocks cost reporting, no workaround.
    validations:
      required: true
  - type: input
    id: reprod-url
    attributes:
      label: "Link"
      description: Link to the affected page, resource, conversation or dashboard — whatever gets a reader to the problem fastest.
      placeholder: ex. https://app.nudgebee.com/kubernetes/details/...
    validations:
      required: false
  - type: textarea
    id: reprod
    attributes:
      label: "Reproduction steps"
      description: Please enter an explicit description of your issue
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
      render: bash
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: "Screenshots"
      description: If applicable, paste or drag in screenshots to help explain your problem.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: bash
    validations:
      required: false
  - type: input
    id: client
    attributes:
      label: "Client details"
      description: Only for UI bugs where the browser or OS is actually relevant. Leave blank otherwise.
      placeholder: ex. Chrome 128 / macOS
    validations:
      required: false