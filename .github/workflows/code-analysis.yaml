name: code-analysis CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - llm/code-analysis/**
      - .github/workflows/code-analysis.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        go-version: ["1.26.x"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ./llm/code-analysis/go.sum

      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-code-analysis-${{ hashFiles('./llm/code-analysis/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-code-analysis-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          working-directory: ./llm/code-analysis
          args: --timeout 20m
