name: code-analysis CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - llm/code-analysis/**
      - .github/workflows/code-analysis.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        go-version: ["1.26.x"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ./llm/code-analysis/go.sum

      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-code-analysis-${{ hashFiles('./llm/code-analysis/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-code-analysis-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          working-directory: ./llm/code-analysis
          args: --timeout 20m

      # -race needs cgo + a C compiler. The self-hosted runner image is minimal
      # and may ship without gcc, so install it before the race-enabled run.
      - name: Install C toolchain (for -race)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      # Unit suite. Tests that need live services or credentials skip themselves
      # when the relevant env vars are unset, so this runs on a bare runner.
      - name: Run unit tests
        working-directory: ./llm/code-analysis
        # setup-go leaves CGO_ENABLED unset; -race requires cgo, so enable it.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      # Compile the tagged end-to-end tests without running them; they require
      # live provider credentials and services unavailable in CI. `go vet`
      # type-checks the tagged files, so build breakage still fails the PR.
      - name: Build e2e-tagged tests (compile-only)
        # Run even if the unit-test step failed, so compile breakage is always
        # reported instead of being masked by an unrelated test failure.
        if: ${{ !cancelled() }}
        working-directory: ./llm/code-analysis
        run: go vet -tags e2e ./...
