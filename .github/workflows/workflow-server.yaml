name: workflow-server CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - runbook-server/**
      - .github/workflows/workflow-server.yaml
      - deploy/kubernetes/workflow-server/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        go-version: ["1.26.x"]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ./runbook-server/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: ./runbook-server
          args: --timeout 20m

      # -race needs cgo + a C compiler. The self-hosted runner image is minimal
      # and may ship without gcc, so install it before the race-enabled run.
      - name: Install C toolchain (for -race)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      # Unit suite. Integration tests that need a live backend (LLM / cloud
      # server / cluster credentials / Postgres / Temporal) live in
      # *_e2e_test.go files behind `//go:build e2e`, so they are excluded from
      # this default run -- it executes only hermetic unit tests on a bare
      # runner. The Postgres+Temporal integration tier (docker-compose.test.yml,
      # `make integration-test`) and the e2e suite stay separate, opt-in concerns.
      - name: Run unit tests
        working-directory: ./runbook-server
        # setup-go leaves CGO_ENABLED unset; -race requires cgo, so enable it.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      # Compile-only gate for the e2e-tagged tests (//go:build e2e). They need
      # live infra CI does not have, so we do NOT run them -- but `go vet`
      # type-checks every file, including the e2e-tagged ones, without executing
      # any binary, so build breakage in them still surfaces on the PR. Switch to
      # `go test -tags e2e ./...` once internal e2e infra exists.
      - name: Build e2e-tagged tests (compile-only)
        # Run even if the unit-test step failed, so e2e compile breakage is
        # always reported instead of being masked by an unrelated test failure.
        if: ${{ !cancelled() }}
        working-directory: ./runbook-server
        run: go vet -tags e2e ./...

  # The blocking predicate in GetActiveResolutionsForRecommendations decides
  # whether a recommendation is skipped, and it has now been wrong twice in a way
  # the sqlmock suite structurally cannot catch: those tests assert on the query
  # TEXT and return canned rows, so they stay green whatever the WHERE clause
  # does (#34943, then #35523, which changed api-server's copy of the predicate
  # and left runbook-server's alone). This job executes the SQL against a real
  # Postgres, which is the only thing that catches it.
  #
  # ubuntu-latest, not the self-hosted runner: service containers need Docker on
  # the runner host, and this mirrors the postgres:15 service that
  # migrations-validate.yaml already runs successfully.
  blocking-predicate-tests:
    name: Blocking predicate (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ./runbook-server/go.sum

      # A test that silently does not run is how this class of bug survived two
      # fixes, so REQUIRE_DB_TESTS below makes a missing DSN fail here.
      - name: Run predicate tests
        working-directory: ./runbook-server
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/appdb?sslmode=disable
          # Turns a missing DSN into a failure in THIS job only, so the suite
          # cannot quietly stop running here.
          REQUIRE_DB_TESTS: "true"
        # No -run filter. Naming every suite in the job is how the coverage this
        # job exists for silently stopped being gated: a new predicate test that
        # did not match the regex was simply skipped, with nothing to say so.
        # requireTestDSN already gates on the database being present, and
        # REQUIRE_DB_TESTS above turns a missing one into a failure here.
        run: go test ./internal/storage/ -v
