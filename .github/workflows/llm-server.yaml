name: llm-server CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - llm/llm-server/**
      - .github/workflows/llm-server.yaml
      - deploy/kubernetes/llm-server/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Image Tag
        id: set-tag
        run: |
          IMAGE_TAG="$(date +'%Y%m%d%H%M00')-$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: llm/llm-server/go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('llm/llm-server/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: llm/llm-server
          only-new-issues: true
          args: --timeout 20m

      # -race needs cgo + a C compiler. The self-hosted runner image is minimal
      # and may ship without gcc, so install it before the race-enabled run.
      - name: Install C toolchain (for -race)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      # Unit suite. Tests that need a live Postgres metastore / Clickhouse
      # warehouse / external credentials skip themselves cleanly via the
      # internal/testenv helpers (testenv.RequireMetastore / RequireWarehouse /
      # RequireEnv), so this runs hermetically on a bare runner. Making those
      # skips real test coverage (throwaway containers) is tracked in #31114.
      - name: Run unit tests
        working-directory: ./api-server/services
        # setup-go leaves CGO_ENABLED unset; -race requires cgo, so enable it.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      # Compile-only gate for the integration-tagged tests
      # (//go:build relay_integration | recommendation_integration). They need
      # live infra CI does not have, so we do NOT run them -- but `go vet`
      # type-checks every file, including the tagged ones, without executing any
      # binary, so build breakage in them still surfaces on the PR.
      - name: Build integration-tagged tests (compile-only)
        # Run even if the unit-test step failed, so compile breakage is always
        # reported instead of being masked by an unrelated test failure.
        if: ${{ !cancelled() }}
        working-directory: ./api-server/services
        run: go vet -tags "relay_integration recommendation_integration" ./...

  # The PR-lifecycle sweeps are plain SQL against recommendation_resolution /
  # event_resolution, and their tests are written against throwaway tables. They
  # were DB-gated with a skip, so on a runner with no database they skipped —
  # which meant nothing checked them at all, and one of them sat asserting the
  # wrong contract until it was first executed. Give them a database so they run.
  #
  # ubuntu-latest, not the self-hosted runner: service containers need Docker on
  # the runner host, and this mirrors the postgres:15 service that
  # migrations-validate.yaml already runs successfully.
  pr-lifecycle-db-tests:
    name: PR lifecycle sweeps (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ./api-server/services/go.sum

      # These tests create and drop their own throwaway tables, so an empty
      # database is all they need — no migrations, no fixtures.
      - name: Run PR-lifecycle DB tests
        working-directory: ./api-server/services
        env:
          APP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb?sslmode=disable
          # Turns an unreachable database into a failure in THIS job only, so the
          # suite cannot quietly stop running here.
          REQUIRE_DB_TESTS: "true"
        run: go test ./account/adapter/ -run '_DB$' -v
