name: llm-server CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - llm/llm-server/**
      - .github/workflows/llm-server.yaml
      - deploy/kubernetes/llm-server/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set Image Tag
        id: set-tag
        run: |
          IMAGE_TAG="$(date +'%Y%m%d%H%M00')-$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: llm/llm-server/go.sum

      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('llm/llm-server/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          working-directory: llm/llm-server
          only-new-issues: true
          args: --timeout 20m

      # -race needs cgo + a C compiler. The self-hosted runner image is minimal
      # and may ship without gcc, so install it before the race-enabled run.
      - name: Install C toolchain (for -race)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      # Unit suite. Tests that need live services or credentials skip themselves
      # when the relevant env vars (TEST_ACCOUNT, TEST_USER, ...) are unset, so
      # this runs on a bare runner.
      - name: Run unit tests
        working-directory: ./llm/llm-server
        # setup-go leaves CGO_ENABLED unset; -race requires cgo, so enable it.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      # Compile the tagged end-to-end tests without running them; they require
      # live provider credentials and services unavailable in CI.
      - name: Build e2e-tagged tests (compile-only)
        if: ${{ !cancelled() }}
        working-directory: ./llm/llm-server
        run: go vet -tags e2e ./...

      # Compile-only gate for the remaining tagged tests
      # (//go:build cross_check | integration). They need live infra CI does
      # not have, so we do NOT run them -- but `go vet` type-checks every file,
      # including the tagged ones, without executing any binary, so build
      # breakage in them still surfaces on the PR.
      - name: Build integration-tagged tests (compile-only)
        # Run even if the unit-test step failed, so compile breakage is always
        # reported instead of being masked by an unrelated test failure.
        if: ${{ !cancelled() }}
        working-directory: ./llm/llm-server
        run: go vet -tags "cross_check integration" ./...
