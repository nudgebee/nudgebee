name: Benchmark-Server CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - llm/benchmark/**
      - .github/workflows/benchmark-server.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "llm/benchmark/uv.lock"

      - name: Install dependencies with uv
        working-directory: ./llm/benchmark
        # --frozen fails if uv.lock is out of date with pyproject.toml,
        # so a pin change without a lock regen can't slip through CI.
        run: uv sync --frozen

      - name: Check formatting
        working-directory: ./llm/benchmark
        run: uv run black --check benchmark_server

      - name: Run lint
        working-directory: ./llm/benchmark
        run: uv run flake8 benchmark_server

      - name: Run unit tests
        working-directory: ./llm/benchmark
        run: uv run pytest benchmark_server/tests llm/agents/event_code_fix -m "not benchmark"
