name: ML Wolfi Base Validation

# Throwaway validation for the Wolfi ml-base migration (#585). Builds the Wolfi
# base and each consumer (ml-k8s-server, rag-server) FROM it on a CI runner —
# validating the FULL dependency tree + runtime shared-lib presence that the
# normal consumer CI (Python lint only) does not cover, and that is impractical
# to build locally.
#
# Each job:
#   1. builds the Wolfi ml-base,
#   2. builds the consumer with --build-arg PYTHON_BASE=<local base>,
#   3. imports the app's real entrypoint module (triggers eager dlopens), and
#   4. runs `ldd` over every native .so in the conda env and FAILS on any
#      "not found" (catches missing system libs Wolfi doesn't ship).
#
# Manually dispatched. Delete this workflow (or promote it to a permanent
# consumer-build gate) once the migration is validated.

on:
  workflow_dispatch:
  # Runs on PRs that touch the ml-base or its consumers, so the Wolfi migration
  # is validated end-to-end on the PR itself (not just post-merge).
  pull_request:
    branches: [main]
    paths:
      - deploy/kubernetes/nudgebee-ml-base-image/**
      - ml-k8s-server/**
      - llm/rag-server/**
      - .github/workflows/ml-wolfi-validate.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `imports` = the native/ML libs each consumer actually uses. Importing
          # them directly exercises the wheels' eager dlopens without tripping the
          # app's own env-var/config guards (which would fail on any base).
          - name: ml-k8s-server
            context: ml-k8s-server
            imports: "import numpy, pandas, sklearn, psycopg2, tensorflow; print('ML_IMPORTS_OK')"
          - name: rag-server
            context: llm/rag-server
            # magic.from_buffer exercises libmagic (ctypes dlopen — the classic
            # Wolfi gap that ldd can't see because it's loaded by name at runtime).
            imports: "import numpy, psycopg2, torch, sentence_transformers, onnxruntime, fitz, unstructured; import magic; magic.from_buffer(b'%PDF-1.4 test'); print('ML_IMPORTS_OK')"
    steps:
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      # Plain `docker build` (default runner builder) so the consumer's
      # FROM ${PYTHON_BASE} resolves the locally-built base image.
      - name: Build Wolfi ml-base
        run: |
          docker build -t nudgebee-ml-base:wolfi-test \
            deploy/kubernetes/nudgebee-ml-base-image

      - name: Build ${{ matrix.name }} on the Wolfi base
        run: |
          docker build \
            --build-arg PYTHON_BASE=nudgebee-ml-base:wolfi-test \
            -t consumer:test \
            ${{ matrix.context }}

      # PRIMARY GATE: importing the native libs triggers their real dlopens. If a
      # genuinely-needed system lib were missing, the import fails here. This is
      # the truth; the ldd sweep below is noisy (flags wheel-bundled RPATH libs +
      # optional GPU/MPI/GUI libs) so it's informational only.
      - name: Import native ML libs (real runtime dlopens — GATE)
        run: |
          docker run --rm --entrypoint sh consumer:test -c \
            "conda run --no-capture-output -n myenv python -c '${{ matrix.imports }}'"

      - name: ldd audit (informational — filters wheel-bundled + optional libs)
        continue-on-error: true
        run: |
          docker run --rm --entrypoint sh consumer:test -c '
            for f in $(find /opt/conda/envs/myenv -name "*.so" -o -name "*.so.*" 2>/dev/null); do
              ldd "$f" 2>/dev/null | grep "not found" || true
            done | \
            # drop hash-suffixed wheel-bundled libs (loaded via RPATH) and the
            # optional GPU / MPI-RDMA / GUI libs that are never loaded on a
            # headless single-node CPU deployment.
            grep -vE "\.so[.0-9]* .*=> not found" -e "-[0-9a-f]{8}" 2>/dev/null | \
            grep -viE "libcuda|nvrtc|cufile|libmpi|liboshmem|libfabric|libibverbs|libmlx5|librdmacm|libucp|libucs|libpmix|libX11|libtk8|libXext|libXrender" || true
            echo "(informational ldd sweep done — see the import GATE above for the real verdict)"
          '

      - name: Import full app entrypoint (best-effort; app config guards may trip)
        continue-on-error: true
        run: |
          docker run --rm --entrypoint sh consumer:test -c \
            "ML_INFERENCE_DATABASE_URL=postgresql://u:p@localhost/db DATABASE_URL=postgresql://u:p@localhost/db conda run --no-capture-output -n myenv python -c 'import server' 2>&1 | tail -20 || true"
