name: llm-gateway-dev-GKE CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - llm/gateway/**
      - .github/workflows/llm-gateway-dev-gke.yaml
      - deploy/kubernetes/llm-gateway/**

jobs:
  lint-and-test:
    name: Go Lint + Test
    runs-on: [self-hosted, X64]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: llm/gateway/go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gw-go-build-${{ hashFiles('llm/gateway/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gw-go-build-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: llm/gateway
          args: --timeout 10m

      # -race needs cgo + a C compiler; the self-hosted image is minimal.
      - name: Install C toolchain (for -race)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      # Unit tests only. Anything needing a live DB / Redis / provider is guarded
      # (config-gated, or a nil store) and skips cleanly here.
      - name: Run unit tests
        working-directory: llm/gateway
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
