name: Notifications Server CI
on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - notifications-server/**
      - .github/workflows/notifications.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notifications-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real broker for tests/test_consumer_reconnect.py (consumer count stays one
    # across broker reconnects). Same RabbitMQ version as the chart.
    services:
      rabbitmq:
        image: ghcr.io/nudgebee/rabbitmq:3-management  # official image, RabbitMQ 3.13.7
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          # postgresql-server-dev-all is a metapackage that pulls in
          # `postgresql-common (= 257build1.1)` from Ubuntu repos, which
          # conflicts with `postgresql-common (= 290.pgdg24.04+1)` already
          # installed from the pgdg PPA on the runner image. Pinning to
          # a specific server-dev version avoids the dependency clash.
          sudo apt-get install -y --no-install-recommends build-essential postgresql-server-dev-16 libsodium-dev

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install dependencies
        working-directory: ./notifications-server
        # --locked fails when uv.lock is out of date with pyproject.toml, so CI
        # and the image (which syncs from the same lock) run the same versions.
        run: uv sync --locked

      - name: Run linters
        working-directory: ./notifications-server
        run: |
          uv run black --check .
          uv run flake8 .

      - name: Run tests
        working-directory: ./notifications-server
        # The broker tests skip when RABBIT_MQ_TEST_HOST is unset; here it is set,
        # so a missing broker fails them.
        env:
          RABBIT_MQ_TEST_HOST: 127.0.0.1
        run: uv run pytest -q
