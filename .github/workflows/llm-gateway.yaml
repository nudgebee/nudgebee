name: llm-gateway CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - llm/gateway/**
      - .github/workflows/llm-gateway.yaml
      - deploy/kubernetes/llm-gateway/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Go Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: llm/gateway/go.sum

      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gw-go-build-${{ hashFiles('llm/gateway/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gw-go-build-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          working-directory: llm/gateway
          only-new-issues: true
          args: --timeout 10m

      # -race needs cgo + a C compiler. Ensure gcc is present before the
      # race-enabled run (idempotent on the hosted runner image).
      - name: Install C toolchain (for -race)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      # Unit tests only. Anything needing a live DB / Redis / provider is guarded
      # (config-gated, or a nil store) and skips cleanly here.
      - name: Run unit tests
        working-directory: llm/gateway
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
