name: nudgebee infra-mirror images

# Patched mirrors of the bitnami infra images (postgres-exporter) deployed alongside nudgebee — see docs/security/image-
# hardening.md Phase 2 (WS3).
#
# Why: Bitnami sunset the free docker.io/bitnami/* images mid-2025; the archived
# docker.io/bitnamilegacy/* tags we pin are frozen (no OS patches since ~Aug
# 2025) and so accrue Debian CVEs. Each Dockerfile rebuilds the SAME bitnami
# image (same app version + base — no data/behaviour change) with an apt-get
# upgrade layer, so the still-security-supported Debian base picks up current
# patches. Published to ghcr.io/<owner>/<image>:<tag>-nb1.
#
# OS_PKG_EPOCH is FED here (the ISO week), not committed like the app images:
# the bitnamilegacy base is frozen, so the weekly schedule below is the only
# thing that keeps these patched, and it needs a changing epoch to bust the apt
# layer. No registry cache for the same reason (caching would re-freeze it).
#
# Multi-arch (amd64 + arm64), same shape as release.yaml / the base-image
# workflows: one cell per arch on its NATIVE runner (no QEMU), pushed as
# <tag>-<arch>, then stitched into a single manifest list under <tag> by the
# merge job. Every upstream we mirror publishes both arches, so dropping arm64
# (as this workflow did originally, on the assumption the cluster is amd64-only)
# silently made the chart uninstallable on Graviton/arm nodes.
# PRs build to validate, no push.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 08:00 UTC — pull current Debian security patches onto the
    # frozen bitnamilegacy bases even with no code change.
    - cron: "0 8 * * 1"
  push:
    branches: ["main"]
    paths:
      - deploy/kubernetes/nudgebee-mirrors/**
      - .github/workflows/infra-mirrors-image.yaml
  pull_request:
    branches: ["main"]
    paths:
      - deploy/kubernetes/nudgebee-mirrors/**
      - .github/workflows/infra-mirrors-image.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      namespace: ${{ steps.v.outputs.namespace }}
      push: ${{ steps.v.outputs.push }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          ns="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # PRs validate only; main / schedule / manual dispatch push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then push=false; else push=true; fi
          {
            echo "namespace=$ns"
            echo "push=$push"
            # ISO week (e.g. 2026-W28) — busts the apt layer weekly so the frozen
            # bitnamilegacy base still picks up current Debian patches.
            echo "epoch=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

  # One cell per (image, arch). The Go build stages in the postgres /
  # postgres-exporter Dockerfiles compile natively for the cell's arch — no
  # cross-compile plumbing needed, because the whole build runs on a runner of
  # that arch.
  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.plat.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        img:
          # -nb2 adds a wait-for-port rebuilt on Go 1.26.5 (clears 2C/19H/43M
          # Go-stdlib CVEs in the stale bitnami startup helper) on top of the apt
          # upgrade. Needs a Go build stage — the shared build step handles it.
          # nb-3 replaces the one-off nb-2 (manually pushed from nudgebee-infra,
          # never ran apt upgrade — 5C/40H/63M fixable had accrued). Consumed by
          # the nudgebee-agent chart's clickhouse subchart.
          - { image: clickhouse,        context: deploy/kubernetes/nudgebee-mirrors/clickhouse,        tag: 24.12.4-debian-12-r0-nb-3 }
          # Distroless passthrough of the upstream prometheus-community image
          # (replaces the CVE-heavy bitnamilegacy build: 2C/35H fixable + debian-11
          # floor -> 0/1/1, 0 unfixable). OS_PKG_EPOCH is accepted but unused there.
          # -nb2 rebuilds the exporter on a patched Go and x/text, on a distroless
          # runtime (v0.20.1 is the newest release, so no tag bump clears these).
          # Needs a Go build stage — the shared build step handles it.
          - { image: postgres-exporter, context: deploy/kubernetes/nudgebee-mirrors/postgres-exporter, tag: v0.20.1-nb2 }
          # Alpine re-mirrors of official images (apk upgrade; no version change).
          # postgres also swaps in a gosu rebuilt on a patched Go (the image's
          # prebuilt gosu carries Go-stdlib CVEs); needs a Go build stage.
          - { image: postgres,          context: deploy/kubernetes/nudgebee-mirrors/postgres,          tag: 16.15-alpine-nb1 }
          # The chart's database: Debian for glibc collation, with gosu rebuilt.
          - { image: postgres,          context: deploy/kubernetes/nudgebee-mirrors/postgres-trixie,   tag: 16.15-trixie-nb1 }
          - { image: nginx,             context: deploy/kubernetes/nudgebee-mirrors/nginx,             tag: stable-alpine3.24-slim-nb1 }
          # Same upstream versions, with the Go binaries rebuilt from source.
          - { image: trivy,             context: deploy/kubernetes/nudgebee-mirrors/trivy,             tag: 0.76.1-nb2 }
          - { image: kube-bench,        context: deploy/kubernetes/nudgebee-mirrors/kube-bench,        tag: v0.16.0-nb2 }
          # kubectl + /bin/sh only, for the rag-server migration hook. Replaces the
          # alpine/k8s toolbox clone; same kubectl source tag, rebuilt on a patched Go.
          - { image: kubectl,           context: deploy/kubernetes/nudgebee-mirrors/kubectl,           tag: 1.32.13-nb1 }
          # Upstream 1.31.4 images with their Go binaries rebuilt from the same tags on
          # a patched Go. Drop both once an upstream release carries the fixes.
          - { image: temporal-server,      context: deploy/kubernetes/nudgebee-mirrors/temporal-server,      tag: 1.31.4-nb1 }
          - { image: temporal-admin-tools, context: deploy/kubernetes/nudgebee-mirrors/temporal-admin-tools, tag: 1.31.4-nb1 }
          # Debian re-mirror of the official image (apt upgrade; same Qdrant version).
          - { image: qdrant,               context: deploy/kubernetes/nudgebee-mirrors/qdrant,               tag: v1.19.2-nb1 }
        plat:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: needs.prepare.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.img.image }} (${{ matrix.plat.arch }}, push=${{ needs.prepare.outputs.push }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.img.context }}
          push: ${{ needs.prepare.outputs.push == 'true' }}
          platforms: ${{ matrix.plat.platform }}
          provenance: false
          # No cache-from/to: we WANT a fresh apt pull each run; a registry cache
          # would re-freeze the OS packages (the exact bug this job fixes).
          build-args: |
            OS_PKG_EPOCH=${{ needs.prepare.outputs.epoch }}
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.namespace }}/${{ matrix.img.image }}:${{ matrix.img.tag }}-${{ matrix.plat.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.img.image }}

  # Stitch the per-arch images into the canonical <tag> manifest list. Skipped on
  # PRs (nothing was pushed to merge).
  #
  # The image/tag pairs below MUST match the build matrix. A drift fails loudly
  # here — `imagetools create` errors with `manifest unknown` for the missing
  # per-arch tag rather than publishing anything wrong.
  merge:
    needs: [prepare, build]
    # Runs when a build leg failed, so one failed image cannot hold back the others.
    # Its own merge row fails loudly on the missing per-arch tag.
    if: ${{ !cancelled() && needs.prepare.outputs.push == 'true' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: clickhouse,        tag: 24.12.4-debian-12-r0-nb-3 }
          - { image: postgres-exporter, tag: v0.20.1-nb2 }
          - { image: postgres,          tag: 16.15-alpine-nb1 }
          - { image: postgres,          tag: 16.15-trixie-nb1 }
          - { image: nginx,             tag: stable-alpine3.24-slim-nb1 }
          - { image: trivy,             tag: 0.76.1-nb2 }
          - { image: kube-bench,        tag: v0.16.0-nb2 }
          - { image: kubectl,           tag: 1.32.13-nb1 }
          - { image: temporal-server,      tag: 1.31.4-nb1 }
          - { image: temporal-admin-tools, tag: 1.31.4-nb1 }
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest for ${{ matrix.image }}
        env:
          REPO: ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          echo "Merging ${REPO}:${TAG} from per-arch images"
          docker buildx imagetools create \
            -t "${REPO}:${TAG}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.title=${{ matrix.image }}" \
            "${REPO}:${TAG}-amd64" \
            "${REPO}:${TAG}-arm64"

          docker buildx imagetools inspect "${REPO}:${TAG}"
