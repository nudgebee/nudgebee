name: K8sCollector CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - collector-server/k8s-collector/app/**
      - .github/workflows/k8s-collector-server.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          # postgresql-server-dev-all is a metapackage that pulls in
          # `postgresql-common (= 257build1.1)` from Ubuntu repos, which
          # conflicts with `postgresql-common (= 290.pgdg24.04+1)` already
          # installed from the pgdg PPA on the runner image. Pinning to
          # a specific server-dev version avoids the dependency clash.
          sudo apt-get install -y --no-install-recommends build-essential postgresql-server-dev-16 libsodium-dev

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./collector-server/k8s-collector/app/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('./collector-server/k8s-collector/app/poetry.lock') }}

      - name: Install dependencies
        working-directory: ./collector-server/k8s-collector/app
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        working-directory: ./collector-server/k8s-collector/app
        run: poetry install --no-interaction

      - name: Run linters
        working-directory: ./collector-server/k8s-collector/app
        run: |
          poetry run black --check .
          poetry run flake8 .
          poetry run mypy *.py

      - name: Run tests
        working-directory: ./collector-server/k8s-collector/app
        run: poetry run pytest -q
