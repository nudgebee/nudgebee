name: Build and Push Cloud Collector Base Image

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'deploy/kubernetes/nudgebee-cloud-collector-base-image/**'
      - '.github/workflows/cloud-collector-base-image.yaml'
  pull_request:
    branches: ['main']
    paths:
      - 'deploy/kubernetes/nudgebee-cloud-collector-base-image/**'
      - '.github/workflows/cloud-collector-base-image.yaml'

env:
  IMAGE_REPO: ${{ secrets.DEV_AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/nudgebee-cloud-collector-base
  ECR_REGISTRY: ${{ secrets.DEV_AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job 1: Generate shared tag
jobs:
  tag:
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.date.outputs.tag }}
    steps:
      - name: Generate tag
        id: date
        run: |
          echo "tag=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

# Job 2: Build & push amd64 image
  build-amd64:
    if: github.ref == 'refs/heads/main'
    needs: tag
    runs-on: [self-hosted, X64]
    env:
      TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v3

      - uses: unfor19/install-aws-cli-action@master

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Build & push amd64 image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $IMAGE_REPO:$TAG-amd64 \
            -f deploy/kubernetes/nudgebee-cloud-collector-base-image/Dockerfile \
            deploy/kubernetes/nudgebee-cloud-collector-base-image

          docker push $IMAGE_REPO:$TAG-amd64

# Job 3: Build & push arm64 image
  build-arm64:
    if: github.ref == 'refs/heads/main'
    needs: tag
    runs-on: [self-hosted, arm64]
    env:
      TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v3

      - name: Install AWS CLI
        run: |
          curl -sL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          rm -rf awscliv2.zip aws

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Build & push arm64 image
        run: |
          docker build \
            --platform linux/arm64 \
            -t $IMAGE_REPO:$TAG-arm64 \
            -f deploy/kubernetes/nudgebee-cloud-collector-base-image/Dockerfile \
            deploy/kubernetes/nudgebee-cloud-collector-base-image

          docker push $IMAGE_REPO:$TAG-arm64

# Job 4: Create & push multi-arch manifest
  manifest:
    if: github.ref == 'refs/heads/main'
    needs: [tag, build-amd64, build-arm64]
    runs-on: [self-hosted, X64]
    env:
      TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - uses: unfor19/install-aws-cli-action@master

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Create & push multi-arch manifest
        run: |
          docker manifest create $IMAGE_REPO:$TAG \
            --amend $IMAGE_REPO:$TAG-amd64 \
            --amend $IMAGE_REPO:$TAG-arm64

          docker manifest push $IMAGE_REPO:$TAG
