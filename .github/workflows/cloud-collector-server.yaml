name: cloud-collector-server CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - collector-server/cloud-collector/**
      - .github/workflows/cloud-collector-server.yaml
      - deploy/kubernetes/cloud-collector-server/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        go-version: ["1.26.x"]

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: ./collector-server/cloud-collector/go.sum

      - name: Cache Go build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('collector-server/cloud-collector/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Local build for CI
        working-directory: ./collector-server/cloud-collector
        run: |
          go build -o cloud-collector-server ./cmd/*.go

      - name: GolangCI Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          working-directory: collector-server/cloud-collector
          args: --timeout 20m
