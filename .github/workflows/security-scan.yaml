name: Image Security Scan

# Grype vulnerability scan of every first-party image this repo publishes
# (`scan` job) plus the third-party images deployed alongside nudgebee
# (`scan-deployed` job, Phase 2 — always report-only).
# Part of the image-hardening program — see docs/security/image-hardening.md.
#
# Grype, not Trivy: customers scan our images with Grype, and it also matches
# binaries that were not installed by the OS package manager (e.g. the
# source-built curl in curlimages/curl, Chrome bundled by Playwright), which
# Trivy does not see. Scanning with the same tool means our numbers match theirs.
#
# Ratchet model: we gate on FIXABLE CRITICAL/HIGH/MEDIUM only (fix.state=fixed),
# because ~389 baseline findings live in Debian/UBI9/Ubuntu base-OS packages that
# upstream has not patched yet (those are chased via base migration in Iter 3, not
# a dependency bump). Un-fixable findings must never be able to keep CI red.
#
# GATE (env below):
#   report  — always exit 0; print counts to the job summary. Current mode (Iter 0).
#   enforce — fail the job if an image has any fixable C/H/M. Flip to this in Iter 4,
#             once Iter 1/2 have driven the fixable count to zero.

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to scan (default: edge = tip of main)'
        default: edge
        type: string
  pull_request:
    paths:
      - '.github/workflows/security-scan.yaml'

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  # Iter 0: report-only. Change to "enforce" in Iter 4.
  GATE: report

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # include-only (not a bare `image:` list) so a few entries can override
        # the tag. `tag` unset means the default below — `edge`, the tip of main,
        # overridable per-run via the workflow_dispatch input.
        include:
          - image: services-server
          - image: services-server-sidecar
          - image: migrations
          - image: app
          - image: ticket-server
          - image: code-analysis-agent
          - image: notifications
          - image: k8s-collector
          - image: cloud-collector-server
          - image: cost-server
          - image: relay-server
          - image: workflow-server
          - image: llm-gateway
          - image: llm-server
          - image: rag-server
          - image: ml-k8s-server
          # These two ship as `:latest`, NOT `:edge` — postgres_migrations.image.tag
          # and llm-server's LLM_SERVER_AGENT_CODEAGENT_IMAGE in
          # deploy/kubernetes/nudgebee/values.yaml both pin `latest`, and the two
          # tags are different digests. Scanning only `edge` reported numbers for
          # an image no operator installs, so scan both: `edge` tracks what main
          # will ship, `latest` is what a chart install pulls today.
          - image: migrations
            tag: latest
          - image: code-analysis-agent
            tag: latest
    steps:
      - name: Resolve namespace
        id: ns
        run: echo "namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Grype
        env:
          GRYPE_VERSION: '0.121.0'
        run: |
          set -euo pipefail
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          tgz="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sfL "$base/$tgz" -o "/tmp/$tgz"
          curl -sfL "$base/grype_${GRYPE_VERSION}_checksums.txt" -o /tmp/grype_checksums.txt
          (cd /tmp && grep " $tgz\$" grype_checksums.txt | sha256sum -c -)
          sudo tar -C /usr/local/bin -xzf "/tmp/$tgz" grype
          grype version

      - name: Update Grype vulnerability DB
        # Fetch the latest DB up front, with retries, so every scan runs against
        # current advisories. Anchore republishes the DB daily; combined with
        # this workflow's daily schedule, newly-disclosed CVEs surface within ~a
        # day with no code change. Fail-closed: if the DB can't be fetched after
        # retries the job errors, rather than scanning against a stale/empty DB.
        # Scans below run with GRYPE_DB_AUTO_UPDATE=false to reuse this exact DB.
        run: |
          set -euo pipefail
          n=0
          until grype db update; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "::error::Grype DB download failed after $n attempts"; exit 1; fi
            echo "DB download attempt $n failed; retrying in 15s..."; sleep 15
          done
          grype db status

      - name: Scan ${{ matrix.image }}:${{ matrix.tag || github.event.inputs.tag || 'edge' }}
        env:
          # matrix.tag wins over the dispatch input: the `latest` entries below
          # exist precisely to pin a tag, so a dispatch asking for some other tag
          # must not collapse them back onto it.
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.ns.outputs.namespace }}/${{ matrix.image }}:${{ matrix.tag || github.event.inputs.tag || 'edge' }}
        run: |
          set -euo pipefail
          echo "Scanning $IMAGE_REF"

          # One scan, two outputs: full table (all severities) for the log,
          # JSON for counting. `registry:` pulls straight from ghcr using the
          # login above, no docker daemon pull. GRYPE_DB_AUTO_UPDATE=false
          # reuses the DB fetched in the step above.
          GRYPE_DB_AUTO_UPDATE=false grype "registry:$IMAGE_REF" \
            -o table -o json=result.json

          # Count fixable C/H/M for the gate. The per-image counts are reported
          # once, as a single table, by the `summary` job below.
          python3 - <<'PY' | tee counts.env
          import json
          d = json.load(open("result.json"))
          n = 0
          for m in d.get("matches") or []:
              v = m["vulnerability"]
              if (v.get("severity") or "").upper() in ("CRITICAL", "HIGH", "MEDIUM") \
                      and (v.get("fix") or {}).get("state") == "fixed":
                  n += 1
          print(f"FIXABLE_TOTAL={n}")
          PY

          # shellcheck disable=SC1091
          source counts.env

          if [ "${GATE}" = "enforce" ] && [ "${FIXABLE_TOTAL}" -gt 0 ]; then
            echo "::error title=Fixable vulnerabilities in ${{ matrix.image }}::${FIXABLE_TOTAL} fixable CRITICAL/HIGH/MEDIUM — bump the dependency/base and rebuild."
            exit 1
          fi
          echo "GATE=${GATE}; fixable C/H/M total=${FIXABLE_TOTAL} (report-only)"

      # Export the raw per-CVE JSON so reports can be generated from CI runs
      # (parallel, reliable) instead of scanning large images locally.
      - name: Upload scan JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Tag suffix only for the pinned-tag entries, so the `edge` artifacts
          # keep their existing `scan-<image>` names. Without it the two
          # `migrations` jobs would both upload `scan-migrations` and the second
          # would fail on the duplicate name.
          name: scan-${{ matrix.image }}${{ matrix.tag && format('-{0}', matrix.tag) || '' }}
          path: result.json
          retention-days: 14

  # Phase 2 (see docs/security/image-hardening.md): the third-party images
  # deployed ALONGSIDE nudgebee — Temporal, Qdrant, and the ghcr.io/nudgebee/*
  # infra mirrors (redis/rabbitmq/postgres/...). A live scan of the nudgebee-oss
  # namespace found these carry ~22x more fixable findings than all first-party
  # images combined, yet were never measured. This job scans them for VISIBILITY
  # only — it is always report-only (never gated), because upstream owns their
  # fixes and we can only bump the pinned tag, not patch on our schedule.
  # Refs are the tags pinned in deploy/kubernetes/nudgebee/values.yaml — keep in
  # sync when those bump (WS3/WS4 will drive them down).
  scan-deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref:
          # --- ghcr.io/nudgebee infra mirrors (current values.yaml pins) ---
          - ghcr.io/nudgebee/postgres:16.15-trixie-nb1
          - ghcr.io/nudgebee/postgres:16.15-alpine-nb1
          - ghcr.io/nudgebee/redis:7.2.17-alpine
          - ghcr.io/nudgebee/rabbitmq:4.2.9-management-alpine
          - ghcr.io/nudgebee/postgres-exporter:v0.20.1-nb2
          - ghcr.io/nudgebee/nginx:stable-alpine3.24-slim-nb1
          - ghcr.io/nudgebee/kubewatch:2.14.1-nb.3
          # --- genuinely third-party, pulled from our ghcr clones ---
          # These are the refs the chart actually deploys: values.yaml points
          # temporal.{server,admintools}.image.repository at ghcr.io/nudgebee/*,
          # cloned by nudgebee-mirrors/clone-third-party.sh, so nothing pulls from
          # Docker Hub. Scan the clone, not the docker.io original — same digest
          # today, but a chart bump moves the clone and the docker.io ref would
          # silently keep reporting on whatever it was pinned to here.
          # temporal-ui not scanned: the Web UI is disabled in the chart (cloned
          # so re-enabling needs no Docker Hub pull, but nothing deploys it).
          - ghcr.io/nudgebee/qdrant:v1.19.2-nb1
          - ghcr.io/nudgebee/temporal-server:1.31.4-nb1
          - ghcr.io/nudgebee/temporal-admin-tools:1.31.4-nb1
          # --- init / helper images the service charts mount ---
          # global.initImages.curl, global.testImage, and rag-server's
          # .Values.migrationHookImage. Small, but they run in-cluster and were
          # never measured.
          - ghcr.io/nudgebee/curl:8.23.0
          - ghcr.io/nudgebee/busybox:1.37.0
          - ghcr.io/nudgebee/kubectl:1.32.13-nb1
          # --- first-party agents / sidecars built in sibling repos ---
          # Measured here so the daily scan covers the whole deployed surface;
          # fixes land in the k8s-agent / node-agent / forager repos and these
          # refs are bumped on their releases.
          - ghcr.io/nudgebee/nudgebee-agent:2026-11-01T06-36-55_f94ccaa1bf84f6288ffa7b0b86a7721ef67f7fae
          - ghcr.io/nudgebee/application-profiler-bpf:e1a00b7
          - ghcr.io/nudgebee/node-agent:0.1.14
          - ghcr.io/nudgebee/forager:0.1.5
          # --- agent-chart runtime dependencies (clickhouse mirror + otel) ---
          - ghcr.io/nudgebee/clickhouse:24.12.4-debian-12-r0-nb-3
          - ghcr.io/nudgebee/opentelemetry-collector-contrib:0.164.0
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Grype
        env:
          GRYPE_VERSION: '0.121.0'
        run: |
          set -euo pipefail
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          tgz="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sfL "$base/$tgz" -o "/tmp/$tgz"
          curl -sfL "$base/grype_${GRYPE_VERSION}_checksums.txt" -o /tmp/grype_checksums.txt
          (cd /tmp && grep " $tgz\$" grype_checksums.txt | sha256sum -c -)
          sudo tar -C /usr/local/bin -xzf "/tmp/$tgz" grype
          grype version

      - name: Update Grype vulnerability DB
        run: |
          set -euo pipefail
          n=0
          until grype db update; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "::error::Grype DB download failed after $n attempts"; exit 1; fi
            echo "DB download attempt $n failed; retrying in 15s..."; sleep 15
          done
          grype db status

      - name: Scan ${{ matrix.ref }} (report-only)
        env:
          IMAGE_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          echo "Scanning $IMAGE_REF (report-only — upstream-owned)"

          # Counts are reported by the `summary` job from the uploaded JSON.
          GRYPE_DB_AUTO_UPDATE=false grype "registry:$IMAGE_REF" \
            -o table -o json=result.json

      - name: Sanitize artifact name
        id: an
        run: echo "name=$(echo '${{ matrix.ref }}' | sed 's#[/:]#_#g')" >> "$GITHUB_OUTPUT"

      - name: Upload scan JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-deployed-${{ steps.an.outputs.name }}
          path: result.json
          retention-days: 14

  # One table for the whole run, so nobody has to scroll ~37 per-image
  # sections. Built from the per-image JSON artifacts uploaded above; the full
  # per-CVE tables stay in each scan job's log and in those artifacts.
  summary:
    needs: [scan, scan-deployed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scan-*
          path: scans

      - name: Write summary table
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          DEPLOYED_RESULT: ${{ needs.scan-deployed.result }}
        run: |
          python3 - scans <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          from pathlib import Path

          SEV = ("CRITICAL", "HIGH", "MEDIUM")
          rows = {"first-party": [], "deployed": []}
          for f in sorted(Path(sys.argv[1]).glob("*/result.json")):
              d = json.load(open(f))
              ref = ((d.get("source") or {}).get("target") or {}).get("userInput") or f.parent.name
              fx = dict.fromkeys(SEV, 0)
              nf = dict.fromkeys(SEV, 0)
              for m in d.get("matches") or []:
                  v = m["vulnerability"]
                  s = (v.get("severity") or "").upper()
                  if s not in fx: continue
                  (fx if (v.get("fix") or {}).get("state") == "fixed" else nf)[s] += 1
              kind = "deployed" if f.parent.name.startswith("scan-deployed-") else "first-party"
              rows[kind].append((ref.removeprefix("registry:"), fx, nf))

          def cell(n, bold):
              return f"**{n}**" if bold and n else str(n)

          print("## Image scan summary (Grype, CRITICAL/HIGH/MEDIUM)\n")
          print(f"Gate: `{os.environ['GATE']}`. Sorted by fixable count, worst first. "
                "Per-CVE detail: each scan job's log, or the `scan-*` JSON artifacts.\n")
          titles = {"first-party": "First-party images", "deployed": "Deployed third-party / sibling-repo images (report-only)"}
          for kind, title in titles.items():
              r = sorted(rows[kind], key=lambda x: (tuple(-x[1][s] for s in SEV), x[0]))
              print(f"### {title} ({len(r)})\n")
              print("| Image | Fixable C | Fixable H | Fixable M | Unfixable C | Unfixable H | Unfixable M |")
              print("|---|--:|--:|--:|--:|--:|--:|")
              for ref, fx, nf in r:
                  print(f"| `{ref}` | " + " | ".join(cell(fx[s], True) for s in SEV) + " | "
                        + " | ".join(cell(nf[s], False) for s in SEV) + " |")
              tf = {s: sum(x[1][s] for x in r) for s in SEV}
              tn = {s: sum(x[2][s] for x in r) for s in SEV}
              print("| **Total** | " + " | ".join(f"**{tf[s]}**" for s in SEV) + " | "
                    + " | ".join(f"**{tn[s]}**" for s in SEV) + " |\n")

          bad = {k: os.environ[v] for k, v in (("scan", "SCAN_RESULT"), ("scan-deployed", "DEPLOYED_RESULT"))
                 if os.environ[v] != "success"}
          if bad:
              print("> [!WARNING]\n> Not every scan job succeeded ("
                    + ", ".join(f"`{k}`: {v}" for k, v in bad.items())
                    + "); images whose scan failed are missing from these tables.\n")
          PY
