name: Migrations Lint

on:
  pull_request:
    paths:
      - 'api-server/migrations/migrations/app/**'
      - '.github/workflows/migrations-lint.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-concurrently:
    name: Reject CONCURRENTLY in migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # golang-migrate wraps every .up.sql / .down.sql in a transaction and
      # ignores the dbmate-style `-- migrate:no-transaction` header. CREATE/DROP
      # INDEX CONCURRENTLY cannot run inside a transaction → migration fails
      # mid-statement and leaves nudgebee.schema_migrations stuck dirty=true,
      # blocking every subsequent migration on every environment. Block at PR
      # time instead. Real cause + recovery: see CLAUDE.md "Database Migrations".
      # Scan migration files for CONCURRENTLY in *executable* SQL — strip
      # `-- ...` line comments first so the historical files that document the
      # rule in comments (e.g. "-- Do not use CREATE INDEX CONCURRENTLY ...")
      # don't trip the lint.
      - name: Grep for CONCURRENTLY in executable SQL
        run: |
          set -e
          fail=0
          for f in api-server/migrations/migrations/app/*.sql; do
            [ -e "$f" ] || continue
            hits=$(sed -E 's/--.*$//' "$f" | grep -nE '\bCONCURRENTLY\b' || true)
            if [ -n "$hits" ]; then
              fail=1
              echo "::error file=$f::contains CONCURRENTLY in executable SQL"
              echo "$hits" | sed "s|^|  $f:|"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::CONCURRENTLY is not allowed in migration files — golang-migrate runs every migration in a transaction and ignores the dbmate-style '-- migrate:no-transaction' header."
            echo "Fix: apply the CREATE/DROP INDEX CONCURRENTLY manually via psql against the live DB *before* merging the PR,"
            echo "     then write the migration with plain CREATE INDEX IF NOT EXISTS / DROP INDEX IF EXISTS."
            echo "     The migration becomes a no-op where you pre-applied it, and a quick locked statement elsewhere."
            exit 1
          fi
          echo "OK: no CONCURRENTLY in executable SQL in migration files."

  model-pricing-image-support:
    name: New model pricing rows set supports_image_input
    runs-on: [self-hosted, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Built-in llm_model_pricing rows are only ever written by migrations, and
      # llm-server refuses image attachments for any model whose
      # supports_image_input is NULL. V880, V984 and V1038 each seeded models
      # without it, which broke images on the default model until V1063
      # backfilled them. So every migration this PR adds that inserts into
      # llm_model_pricing must set the column explicitly: true, false, or
      # copied from a row that has it. Files already merged are not checked.
      - name: Check added migrations that insert model pricing rows
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          fail=0
          for f in $(git diff --name-only --diff-filter=A "$base" HEAD -- 'api-server/migrations/migrations/app/*.up.sql'); do
            sql=$(sed -E 's/--.*$//' "$f" | tr '\n' ' ')
            echo "$sql" | grep -qiE 'INSERT[[:space:]]+INTO[[:space:]]+(public\.)?llm_model_pricing\b' || continue
            if ! echo "$sql" | grep -qi 'supports_image_input'; then
              fail=1
              echo "::error file=$f::inserts into llm_model_pricing without setting supports_image_input"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::Set supports_image_input on every new built-in model row (true if the provider's docs list image input, false if not)."
            echo "A NULL makes llm-server refuse image attachments on that model."
            exit 1
          fi
          echo "OK: every added migration that inserts model pricing rows sets supports_image_input."
