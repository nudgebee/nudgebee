# Action routing + ALLOW-LIST gate consumed by @lib/rpcGateway.
#
# Each action's `permissions:` block becomes the FIRST authorization gate —
# rpcGateway refuses the call if none of the user's `allowed_roles` match.
# super_admin sessions bypass this gate (handled in rpcGateway, not here).
#
# This is one of TWO sources of truth for role gating:
#   1. THIS FILE — front-of-gate, fast-fail by role
#   2. Upstream handlers — re-validate via security context (IsSuperAdmin,
#      tenant scoping, etc.)
#
# Both must agree. If you add an action here, the handler must enforce the
# same role bounds; never rely on the YAML gate alone, and never let the
# handler be more permissive than what `permissions:` declares.
actions:
  - name: integrations_aggregate
    comment: Aggregate configured integrations grouped by type and status
    definition:
      kind: "synchronous"
      handler: '{{SERVICE_API_SERVER_URL}}/rpc/query'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: ACTION_API_SERVER_TOKEN
    permissions:
      - role: tenant_admin
      - role: tenant_admin_readonly
  - name: integrations_list
    comment: List configured integrations with their type and connection status
    definition:
      kind: "synchronous"
      handler: '{{SERVICE_API_SERVER_URL}}/rpc/query'
