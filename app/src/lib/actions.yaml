  # Memory module RPC surface (9 verb-named actions, all dispatched to
  # /v1/memory_v2). The handler reads `layer` and `scope` from the request
  # payload to route internally, replacing the 39 per-(layer,scope,verb)
  # actions that originally shipped with Phases 2–8. Tenant-scope writes
  # are still gated server-side by requireTenantAdmin — the actions.yaml
  # permissions list every role that can call any combination, not just
  # the most privileged.
  - name: ai_memory_get
    definition:
      kind: "synchronous"
      handler: '{{LLM_SERVER_URL}}/v1/memory_v2'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: LLM_SERVER_TOKEN
    permissions:
      - role: tenant_usage
      - role: tenant_admin_readonly
      - role: tenant_admin
      - role: k8s_namespace_admin_readonly
      - role: k8s_namespace_admin
      - role: account_admin_readonly
      - role: account_admin
    comment: Single-record read — layer one of (soul, consent), scope one of (user, tenant).
  - name: ai_memory_list
    definition:
      kind: "synchronous"
      handler: '{{LLM_SERVER_URL}}/v1/memory_v2'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: LLM_SERVER_TOKEN
    permissions:
      - role: tenant_usage
      - role: tenant_admin_readonly
      - role: tenant_admin
      - role: k8s_namespace_admin_readonly
      - role: k8s_namespace_admin
      - role: account_admin_readonly
      - role: account_admin
    comment: Collection read — layer one of (prefs, patterns, decisions, collective, session, events). Pass `q` with layer=collective for full-text search.
  - name: ai_memory_upsert
    definition:
      kind: "synchronous"
      handler: '{{LLM_SERVER_URL}}/v1/memory_v2'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: LLM_SERVER_TOKEN
    permissions:
      - role: tenant_usage
      - role: tenant_admin
      - role: account_admin
    comment: Insert-or-update — layer one of (soul, prefs, consent, decisions[scope=tenant]). Tenant-scope writes gated server-side on tenant_admin.
  - name: ai_memory_delete
    definition:
      kind: "synchronous"
      handler: '{{LLM_SERVER_URL}}/v1/memory_v2'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: LLM_SERVER_TOKEN
    permissions:
      - role: tenant_usage
      - role: tenant_admin
      - role: account_admin
    comment: Remove a row when `id` is set; wipe the (layer, scope) when `id` is omitted. Includes the GDPR full-wipe path (layer=all, scope=user).
  - name: ai_memory_confirm
    definition:
      kind: "synchronous"
      handler: '{{LLM_SERVER_URL}}/v1/memory_v2'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: LLM_SERVER_TOKEN
    permissions:
      - role: tenant_usage
      - role: tenant_admin
      - role: account_admin
    comment: Keep an inferred preference — makes it explicit so agents inject it, while retaining its evidence and inferred origin so it stays reviewable and reversible. Preferences layer, user scope only.
  - name: ai_memory_unconfirm
    definition:
      kind: "synchronous"
      handler: '{{LLM_SERVER_URL}}/v1/memory_v2'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: LLM_SERVER_TOKEN
    permissions:
      - role: tenant_usage
      - role: tenant_admin
      - role: account_admin
    comment: Unkeep a previously kept preference, returning it to the unreviewed pool. Only affects rows of inferred origin, so a user-authored preference can never be downgraded by this path.
  - name: ai_memory_create_decision
    definition:
      kind: "synchronous"
      handler: '{{LLM_SERVER_URL}}/v1/memory_v2'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: LLM_SERVER_TOKEN
    permissions:
      - role: tenant_usage
      - role: tenant_admin_readonly
      - role: tenant_admin
