      - role: account_admin_readonly
      - role: k8s_namespace_admin
      - role: k8s_namespace_admin_readonly
  # Dynamic-RBAC custom roles (customroles_*) are EE-only. Their action
  # definitions live in app/src/ee/actions.yaml (merged at EE build by
  # loadRpcRoutes) and are stripped from OSS snapshots, so OSS exposes no
  # customroles_* RPC and falls back to the built-in roles.
  - name: users_list_tenants
    comment: List the tenants the current user can access
    definition:
      kind: "synchronous"
      handler: '{{SERVICE_API_SERVER_URL}}/rpc/user'
      forward_client_headers: true
      # Identity-scoped, cross-tenant action: lists the tenants the
      # authenticated user belongs to (handler filters by username). Must stay
      # reachable even when the user holds no role in the active tenant —
      # otherwise the Switch-Tenant modal can't show them a tenant to switch to
      # (chicken-and-egg lockout). The gateway skips its tenant-role gate for
      # tenant_agnostic actions. See forwardAction in src/lib/rpcGateway.ts.
      tenant_agnostic: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: ACTION_API_SERVER_TOKEN
    permissions:
      - role: tenant_admin
