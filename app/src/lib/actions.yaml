  # Cross-tenant read: lists ALL tenants in the system (unlike tenants_list,
  # which the query engine scopes to the caller's own tenant). Used by the
  # super-admin Switch-Tenant modal to reach tenants the user isn't a member
  # of. Restricted to super admins: a full super_admin bypasses the gateway
  # role gate, but super_admin_readonly does NOT (the bypass only keys off
  # `super_admin`), so both tokens are listed here to pass the gate. The
  # upstream handler re-checks IsSuperAdmin()/IsSuperAdminReadonly() as the
  # authoritative gate.
  - name: tenant_list_all
    comment: List all tenants (super-admin)
    definition:
      kind: "synchronous"
      handler: '{{SERVICE_API_SERVER_URL}}/rpc/tenant'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
