    definition:
      kind: synchronous
      handler: '{{SERVICE_API_SERVER_URL}}/v1/relay/request'
      forward_client_headers: true
      headers:
        - name: X-ACTION-TOKEN
          value_from_env: ACTION_API_SERVER_TOKEN
    # Read-capable roles can load live cluster resources (PVC/PV/Services tabs,
    # which send action_name: get_resource). The api-server relay handler
    # (services/api/relay.go) re-checks every request: read actions need
    # account Read access, while mutating action_names (writeActions map:
    # delete_pod, replace_workload, ...) require Update — so read-only roles
    # here can list but never mutate. k8s_namespace_admin roles are excluded:
    # the list forwards all_namespaces=true, which would over-expose a
    # namespace-scoped user.
    permissions:
      - role: tenant_admin
      - role: tenant_admin_readonly
      - role: account_admin
      - role: account_admin_readonly
