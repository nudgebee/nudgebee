apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "notification.fullname" . }}-test-connection"
  labels:
    {{- include "notification.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: ghcr.io/nudgebee/busybox:1.37.0
      command: ['wget']
      args: ['{{ include "notification.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
