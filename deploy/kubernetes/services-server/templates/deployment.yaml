apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "services-server.fullname" . }}
  labels:
    {{- include "services-server.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}    
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "services-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "services-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (( default .Values.global.imagePullSecrets .Values.imagePullSecrets )) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "services-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initCheckEnabled | default true }}
      initContainers:
        - name: db-check
          image: {{ .Values.global.initImages.postgres }}
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until pg_isready -d "$APP_DATABASE_URL"; do echo "Waiting for PostgreSQL to be ready..."; sleep 2; done;']
          envFrom:
            - secretRef:
                name: {{ include "nudgebee.secretName" . | quote }}
      {{- end}}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "imageName" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "nudgebee.secretName" . | quote }}
            {{- with .Values.extraEnvFromSecret }}
            # Install-time bootstrap values (admin address, bundled-agent
            # credential). Optional: absent on installs that use neither, and
            # the pod must start regardless.
            - secretRef:
                name: {{ . | quote }}
                optional: true
            {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}          
            {{- /* Navigate resources.limits.memory nil-safely: a bare
                   .Values.resources.limits.memory panics if an operator overrides resources to
                   {} or null, and Sprig's dig rejects .Values (chartutil.Values, not a plain
                   map). Chaining `| default dict` yields "" when any level is missing. */}}
            {{- $limits := (.Values.resources | default dict).limits | default dict }}
            {{- $limMem := $limits.memory | default "" | toString }}
            {{- if and $limMem (not (hasKey (default dict .Values.env) "GOMEMLIMIT")) }}
            {{- /* Compute ~90% of limits.memory as an integer MiB value. Match the
                   Kubernetes quantity suffixes case-sensitively: binary Gi/Mi and
                   decimal G/M (1G=1e9 B ≈ 953.674 MiB, 1M=1e6 B ≈ 0.953674 MiB).
                   NOT lowercased — k8s quantities are case-sensitive, and lowercase
                   "m" is milli (e.g. 3000m = 3 bytes), not mega. */}}
            {{- $mib := 0 }}
            {{- if hasSuffix "Gi" $limMem }}
            {{-   $mib = mulf (trimSuffix "Gi" $limMem) 1024 0.9 | floor | int }}
            {{- else if hasSuffix "Mi" $limMem }}
            {{-   $mib = mulf (trimSuffix "Mi" $limMem) 0.9 | floor | int }}
            {{- else if hasSuffix "G" $limMem }}
            {{-   $mib = mulf (trimSuffix "G" $limMem) 953.674 0.9 | floor | int }}
            {{- else if hasSuffix "M" $limMem }}
            {{-   $mib = mulf (trimSuffix "M" $limMem) 0.953674 0.9 | floor | int }}
            {{- end }}
            {{- if gt $mib 0 }}
            # Soft-cap the Go heap at ~90% of the container memory limit so the
            # runtime GCs (and returns freed pages) aggressively as it approaches
            # the cgroup cap, instead of being OOM-killed. GOMEMLIMIT bounds only
            # the Go heap, so the ~10% headroom covers non-heap memory (goroutine
            # stacks, runtime/GC metadata, freed-but-unreturned pages) that would
            # otherwise push total RSS over the limit and OOM before a GC fires.
            # Go does NOT read the cgroup memory limit itself (container awareness
            # is GOMAXPROCS/CPU only), so without this the runtime happily lets the
            # heap grow past the cap before a collection ever fires.
            # Computed from limits.memory (the downward API can't scale below 100%
            # for the memory resource — only integer/unit divisors are allowed).
            - name: GOMEMLIMIT
              value: "{{ $mib }}MiB"
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      
      {{- if .Values.allowSideCar }}  
        - name: pprof-sidecar
          image: {{ include "imageSidecarName" . }}
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy }}
          volumeMounts:
            - name: ssh-key
              mountPath: /root/.ssh
              readOnly: true
          env:
            - name: MEMORY_LIMIT_IN_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: {{ .Chart.Name }}
                  resource: limits.memory
                  divisor: 1
            - name: VM_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sidecar.sshSecretName | default "nb-dev-db-vm-ssh-key-secret" }}
                  key: vm_host
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "200Mi"
      {{- end }}

      {{- if .Values.allowSideCar }}
      volumes:
        - name: ssh-key
          secret:
            secretName: nb-dev-db-vm-ssh-key-secret
            items:
              - key: id_rsa
                path: id_rsa
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
