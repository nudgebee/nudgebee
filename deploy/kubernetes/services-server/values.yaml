# Default values for services-server-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nudgebee-services-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.10-alpine'
    curl: 'ghcr.io/nudgebee/curl:8.10.1'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: 'nginx'
  # -- Annotations to be added to the ingress.
  annotations: {}
  # -- Ingress host configuration.
  # @default -- See [values.yaml](values.yaml).
  hosts: [] # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []

secretName: 'nudgebee'

resources:
  limits:
    cpu: 500m
    memory: 1500Mi
  requests:
    cpu: 300m
    memory: 1024Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}

# Scanner images for scan_orchestrator. Tags live here — bump in a PR or let
# CI resolve them. trivy/kube-bench are upstream Aqua images republished under
# ghcr.io/nudgebee; popeye is our fork. Nova is published by
# nova/.github/workflows/build-image.yaml, and release.yaml bumps the Nova and
# Popeye tags at package time.
#
# Keep in sync with the defaults in
# api-server/services/scan_orchestrator/images.go — scanner-images-verify.yaml
# fails the build if a tag here doesn't resolve on its registry.
env:
  NOVA_IMAGE: 'ghcr.io/nudgebee/nova:2026-05-22T07-15-34_decaacbbf56e1789c3299a89f790b8e824ab741c'
  TRIVY_IMAGE: 'ghcr.io/nudgebee/trivy:0.58.0'
  POPEYE_IMAGE: 'ghcr.io/nudgebee/popeye:v0.11.1-nudgebee.1'
  KUBE_BENCH_IMAGE: 'ghcr.io/nudgebee/kube-bench:v0.10.4'
