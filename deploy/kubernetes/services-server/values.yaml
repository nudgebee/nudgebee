# Extra Secret to load env from, in addition to the main nudgebee Secret.
# Referenced optionally, so a missing Secret does not block startup.
extraEnvFromSecret: ''
# Default values for services-server-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nudgebee-services-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.15-alpine-nb1'
    curl: 'ghcr.io/nudgebee/curl:8.23.0'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

# Keeps a terminating pod serving until it has left the Service's endpoints.
# Without it the process exits on SIGTERM while kube-proxy still routes new
# connections to the pod's IP, and callers (every app request's session check)
# sit out a 10s connect timeout. The image is alpine, so `sleep` exists; an
# exec hook also works on clusters older than the native sleep action (1.30).
lifecycle:
  preStop:
    exec:
      command: ['sleep', '10']

# Time from the pod being told to stop until SIGKILL. It has to cover the
# preStop sleep (10s), the server's drain of in-flight requests (up to 15s,
# shutdownTimeout in cmd/main.go), closing DB/MQ, and the telemetry flush (up
# to 5s). The Kubernetes default of 30s leaves almost no headroom for that.
terminationGracePeriodSeconds: 45

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: 'nginx'
  # -- Annotations to be added to the ingress.
  annotations: {}
  # -- Ingress host configuration.
  # @default -- See [values.yaml](values.yaml).
  hosts: [] # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []

secretName: 'nudgebee'

# Small-tier defaults. See docs/sizing-and-tiers.md for the tier definitions and
# the measurements these come from; values-medium/large.yaml override them.
# Memory: steady state is 90-240Mi, but the finops-score recompute cron runs every
# 6h for 80-90 minutes and materialises the whole recommendation set — 1.0Gi peak on
# a small estate, 6.7Gi on the largest measured one. The old 1500Mi limit was below
# that peak even at Small, so the cron OOM-killed the pod. Do not lower the limit
# without changing the cron (tracked as the batch-recompute streaming fix).
#
# 4Gi, not 2Gi: a 15-day re-measurement found the dev deployment OOM-killing this
# container 11 times against a 2500Mi limit — i.e. the recompute exceeds 2.5Gi on a
# mid-sized estate even though the 30s-resolution working-set samples only caught
# 1804Mi. The sampled peak is a floor on the real peak, not the peak, so the limit
# has to clear the largest limit observed to fail, not the largest sample observed.
# CPU: p95 is 24-46m; the old 300m request reserved ~10x what the service uses.
resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 150m
    memory: 500Mi

# Background-job ("worker") deployment.
#
# Off by default: with worker.enabled false there is exactly one deployment and
# it does what it always did — serve HTTP *and* drain every RabbitMQ queue. That
# is what every single-replica, OSS and on-prem install wants, and it is the
# only shape a one-pod install can have.
#
# Turn it on and the deployment splits in two: the existing deployment runs with
# SERVER_ROLE=api and serves only HTTP, while a second `<fullname>-worker`
# deployment runs the consumers and the EE background goroutines. The two roles
# are complementary by construction, so there is no way to end up with a queue
# nobody consumes — see templates/_helpers.tpl "services-server.serverRole".
#
# Scheduled crons: runbook-server fires them at /rpc-cron, and each one runs as
# a goroutine on whichever pod took the call. Enabling the worker also renders a
# `<fullname>-worker` Service; set runbook-server's SERVICE_API_SERVER_CRON_URL
# to it to move those jobs onto the worker. Unset, they stay on the API pods.
# Enable the worker before setting that URL, and unset it before disabling the
# worker — runbook-server bakes the URL into its schedules at startup.
#
# Worth knowing before enabling: background work started from inside a
# user-facing HTTP handler (scan_orchestrator's heartbeat evaluation,
# application/profiler tickers, triage's rule-match batcher) is NOT moved by
# this — it still runs on the API pods. Don't size API resources down on the
# assumption they are now HTTP-only.
worker:
  enabled: false
  # Fixed on purpose — no HPA. The point of the split is a known, deterministic
  # number of consumers; autoscaling would silently change per-queue
  # concurrency (replicas x the rabbit_mq_*_concurrency config values).
  replicaCount: 1
  # Each of the following falls back to the top-level value when unset, so a
  # worker only needs to override what genuinely differs from the API pods.
  resources: {}
  podAnnotations: {}
  # lifecycle is different: an empty value is not a fallback. Leave it unset
  # to inherit the top-level hook, or set `lifecycle: {}` to drop the preStop
  # on the worker only.
  nodeSelector: {}
  tolerations: []
  affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}

# Scanner images for scan_orchestrator. Tags live here — bump in a PR or let
# CI resolve them. trivy/kube-bench are upstream Aqua images republished under
# ghcr.io/nudgebee; popeye is our fork. Nova is published by
# nova/.github/workflows/build-image.yaml, and release.yaml bumps the Nova and
# Popeye tags at package time.
#
# Keep in sync with the defaults in
# api-server/services/scan_orchestrator/images.go — scanner-images-verify.yaml
# fails the build if a tag here doesn't resolve on its registry.
env:
  NOVA_IMAGE: 'ghcr.io/nudgebee/nova:2026-05-22T07-15-34_decaacbbf56e1789c3299a89f790b8e824ab741c'
  TRIVY_IMAGE: 'ghcr.io/nudgebee/trivy:0.76.1-nb1'
  POPEYE_IMAGE: 'ghcr.io/nudgebee/popeye:v0.11.1-nudgebee.1'
  KUBE_BENCH_IMAGE: 'ghcr.io/nudgebee/kube-bench:v0.16.0-nb1'
