# Default values for qdrant-server
# This is a YAML-formatted file.

replicaCount: 1

image:
  # ghcr clone of docker.io/qdrant/qdrant — avoids Docker Hub rate limits.
  # Copied via deploy/kubernetes/nudgebee-mirrors/clone-third-party.sh (crane).
  repository: ghcr.io/nudgebee/qdrant
  pullPolicy: IfNotPresent
  tag: "v1.19.2"

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels:
  app: nudgebee-qdrant-server

podSecurityContext: { }

securityContext: { }

service:
  type: ClusterIP
  # HTTP API port
  httpPort: 6333
  # gRPC port (optional, for better performance)
  grpcPort: 6334

# Resource limits optimized for ~700MB memory footprint with on-disk storage
# Small-tier defaults. See docs/sizing-and-tiers.md.
# Memory tracks knowledge-base content, not estate size: 17Mi on an empty install,
# 343-424Mi mid-sized, 1079Mi average with a 1620Mi peak on the largest. The old
# 1Gi limit was BELOW the average of the largest deployment — it was live-OOMing
# there. 2Gi covers the measured peak at Small; values-large.yaml raises it again.
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 500Mi

# Startup probe: gives Qdrant up to 10 minutes to recover collections on startup
# 60 failures * 10 seconds = 600 seconds (10 minutes)
startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Persistent volume for Qdrant storage
persistence:
  enabled: true
  size: 50Gi
  # Consulted only when global.storageClass is empty (that global, set once in the
  # umbrella values.yaml, wins — bitnami's precedence, which this chart matches).
  # Both empty means no storageClassName, i.e. the cluster's default StorageClass.
  # "-" disables dynamic provisioning (renders storageClassName: "").
  storageClass: ''
  accessMode: ReadWriteOnce
  mountPath: /qdrant/storage

labels:
  app: nudgebee-qdrant-server

# Qdrant configuration
config:
  # Enable on-disk storage for vectors (low memory footprint)
  storage:
    on_disk_payload: true
    optimizers:
      indexing_threshold_kb: 20000
      memmap_threshold_kb: 10000
  # Performance tuning for faster startup
  performance:
    max_optimization_threads: 2

nodeSelector: { }

tolerations: [ ]

affinity: { }
