# Default values for relay-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
# Relay pods share direct-mode MCP sessions through Redis by default
# (docs/mcp-sessions.md). Only an install without Redis should set
# env.MCP_SESSION_STORE=memory, and then it must run a single replica.

# Ed25519 signing of requests forwarded to native k8s agents, so agents can
# authorize UI-triggered workload mutations. Additive + backward-compatible
# (old/unkeyed agents ignore it), so on by default; set false to disable.
signing:
  signK8sEnabled: true

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.15-alpine-nb1'
    curl: 'ghcr.io/nudgebee/curl:8.23.0'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'

image:
  repository: nudgebee-relay-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: 'nginx'
  # -- Annotations to be added to the ingress.
  annotations:
    cert-manager.io/issuer: cert-letsencrypt-issuer
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'

  # -- Ingress host configuration.
  # By default, the chart only exposes the routes required from outside the
  # cluster: `/register` (WebSocket agent connections) and `/status` (health
  # checks). Internal routes (`/request`, `/prometheus/*`, `/grafana/*`,
  # `/debug/pprof/*`, etc.) are consumed in-cluster over RELAY_SERVER_ENDPOINT
  # (http://relay-server:8080) and are not exposed at the ingress.
  # @default -- See [values.yaml](values.yaml).
  hosts: []
  # - host: relay.example.com
  #   paths:
  #     - path: /register
  #       pathType: Prefix
  #     - path: /status
  #       pathType: Prefix
  # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []

secretName: 'nudgebee'

# Small-tier defaults. See docs/sizing-and-tiers.md.
# Agent connections are close to free: 27-46Mi average regardless of how many
# clusters are attached (the largest measured deployment holds ~77 and still sits
# at 39Mi). Peaks reach 230Mi during reconnect storms, which is what the limit
# covers. The old 500Mi request reserved ~12x the steady state.
#
# 1.5Gi, not 1Gi: a 15-day re-measurement found 7 pods OOM-killed (26 restarts)
# against a 1000Mi limit on dev, with a sampled peak of only 865Mi. Large payloads
# cross this process twice on the reply path, so the allocation spike that kills the
# pod is shorter than the 30s scrape interval — a 1Gi ceiling is the one that was
# already failing, so it cannot be the fix.
resources:
  limits:
    cpu: 500m
    memory: 1.5Gi
  requests:
    cpu: 50m
    memory: 100Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}
