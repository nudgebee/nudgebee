apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay-server.fullname" . }}
  labels:
    {{- include "relay-server.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}    
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "relay-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "relay-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (( default .Values.global.imagePullSecrets .Values.imagePullSecrets )) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "relay-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initCheckEnabled | default true }}
      initContainers:
        - name: db-check
          image: {{ .Values.global.initImages.postgres }}
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until pg_isready -h $(echo "$COLLECTOR_DB_URL" | sed "s/.*@\(.*\):.*/\1/") -U $(echo "$COLLECTOR_DB_URL" | sed "s/.*:\/\/\([^:]*\):.*/\1/"); do echo "Waiting for PostgreSQL to be ready..."; sleep 2; done;']
          envFrom:
            - secretRef:
                name: {{ include "nudgebee.secretName" . | quote }}
      {{- end }} 
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "imageName" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "nudgebee.secretName" . | quote }}
          env:
            - name: SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            # Sign requests forwarded to native k8s agents so they can authorize
            # UI-triggered workload mutations. Additive + safe, so on by default
            # (values.yaml); acts as a kill-switch. Don't use `default` here —
            # sprig treats bool false as empty and would force it back to true.
            - name: SIGNING_SIGN_K8S_ENABLED
              value: {{ .Values.signing.signK8sEnabled | quote }}
            {{- /* This chart did not render .Values.env at all, so any custom env
                   var set by an operator was silently dropped. That became actively
                   harmful once the GOMEMLIMIT block below started honouring
                   .Values.env as an override: setting env.GOMEMLIMIT suppressed the
                   computed value and rendered nothing in its place. */}}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- /* Navigate resources.limits.memory nil-safely: a bare
                   .Values.resources.limits.memory panics if an operator overrides resources to
                   {} or null, and Sprig's dig rejects .Values (chartutil.Values, not a plain
                   map). Chaining `| default dict` yields "" when any level is missing. */}}
            {{- $limits := (.Values.resources | default dict).limits | default dict }}
            {{- $limMem := $limits.memory | default "" | toString }}
            {{- if and $limMem (not (hasKey (default dict .Values.env) "GOMEMLIMIT")) }}
            {{- /* Compute ~90% of limits.memory as an integer MiB value. Match the
                   Kubernetes quantity suffixes case-sensitively: binary Gi/Mi and
                   decimal G/M (1G=1e9 B ≈ 953.674 MiB, 1M=1e6 B ≈ 0.953674 MiB).
                   NOT lowercased — k8s quantities are case-sensitive, and lowercase
                   "m" is milli (e.g. 3000m = 3 bytes), not mega. */}}
            {{- $mib := 0 }}
            {{- if hasSuffix "Gi" $limMem }}
            {{-   $mib = mulf (trimSuffix "Gi" $limMem) 1024 0.9 | floor | int }}
            {{- else if hasSuffix "Mi" $limMem }}
            {{-   $mib = mulf (trimSuffix "Mi" $limMem) 0.9 | floor | int }}
            {{- else if hasSuffix "G" $limMem }}
            {{-   $mib = mulf (trimSuffix "G" $limMem) 953.674 0.9 | floor | int }}
            {{- else if hasSuffix "M" $limMem }}
            {{-   $mib = mulf (trimSuffix "M" $limMem) 0.953674 0.9 | floor | int }}
            {{- end }}
            {{- if gt $mib 0 }}
            # Soft-cap the Go heap at ~90% of the container memory limit so the
            # runtime GCs (and returns freed pages) aggressively as it approaches
            # the cgroup cap, instead of being OOM-killed. GOMEMLIMIT bounds only
            # the Go heap, so the ~10% headroom covers non-heap memory (goroutine
            # stacks, runtime/GC metadata, freed-but-unreturned pages) that would
            # otherwise push total RSS over the limit and OOM before a GC fires.
            # Go does NOT read the cgroup memory limit itself (container awareness
            # is GOMAXPROCS/CPU only), so without this the runtime happily lets the
            # heap grow past the cap before a collection ever fires.
            # Computed from limits.memory (the downward API can't scale below 100%
            # for the memory resource — only integer/unit divisors are allowed).
            - name: GOMEMLIMIT
              value: "{{ $mib }}MiB"
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # /healthz/live fails only when a tenant has had no RabbitMQ consumer
          # for RELAY_HEALTH_CONSUME_FAILURE_RESTART_AFTER (5m) *while the
          # broker is reachable* — the one state a restart actually repairs. It
          # stays healthy through a broker outage, so RabbitMQ going down does
          # not crashloop every relay and drop its agent WebSockets. Set that
          # duration to 0 to disable the check without redeploying the chart.
          #
          # failureThreshold x periodSeconds adds ~1m on top of that window, so
          # nothing transient can reach a restart.
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Readiness deliberately stays on the unconditional /status. Marking
          # the pod unready removes it from the Service but restarts nothing,
          # and at replicaCount: 1 it would turn one stuck tenant into a total
          # outage. It is also what external load balancers probe.
          readinessProbe:
            httpGet:
              path: /status
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
