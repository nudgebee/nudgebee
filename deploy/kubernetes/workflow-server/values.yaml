# Default values for workflow-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nudgebee-workflow-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.15-alpine-nb1'
    curl: 'ghcr.io/nudgebee/curl:8.23.0'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

# Egress policy for Jobs created by the workflow scripting executor. The
# template excludes link-local, RFC1918, CGNAT, and loopback IPv4 by default.
# Add internalCIDRs if the cluster has internal addresses outside those ranges
# or its CNI evaluates Service VIPs before translation to Pod IPs. Confirm
# enforcement and internal-Service denial with a live Job on each cluster.
scriptPodNetworkPolicy:
  enabled: true
  annotations: {}
  internalCIDRs: []
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: 'nginx'
  # -- Annotations to be added to the ingress.
  annotations: {}
  # -- Ingress host configuration.
  # @default -- See [values.yaml](values.yaml).
  hosts: [] # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []

secretName: 'nudgebee'

# Small-tier defaults. See docs/sizing-and-tiers.md.
# Flat across every measured deployment: 31-94Mi average, 63-133Mi peak, CPU p95
# 2-46m. The chart previously shipped no memory limit.
resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 50m
    memory: 250Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}
