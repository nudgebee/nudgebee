{{- /* ServiceMonitor is a Prometheus Operator CRD. Skip it when the cluster has
       no monitoring.coreos.com/v1, so enabling metrics on a cluster without the
       operator degrades to "no auto-discovery" instead of failing the install
       with `no matches for kind "ServiceMonitor"`. Offline renders (helm
       template, Argo CD) see no API versions, so pass
       --api-versions=monitoring.coreos.com/v1 there. */}}
{{- if and .Values.metrics.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "k8s_collector.fullname" . }}
  labels:
    {{- include "k8s_collector.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "k8s_collector.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
