{{- if .Values.rabbitmq.enabled }}
{{- $r := include "nudgebee.rabbitmq.values" . | fromYaml }}
{{- $fullname := include "nudgebee.rabbitmq.fullname" . }}
{{- $sm := $r.metrics.serviceMonitor }}
{{- $pr := $r.metrics.prometheusRule }}
{{- if and $r.metrics.enabled $sm.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  namespace: {{ default (include "nudgebee.rabbitmq.namespace" .) $sm.namespace | quote }}
  labels:
    {{- include "nudgebee.rabbitmq.labels" (dict "custom" (merge (dict) ($sm.labels | default (dict)) ($r.commonLabels | default (dict))) "root" $) | nindent 4 }}
  {{- with (merge (dict) ($sm.annotations | default (dict)) ($r.commonAnnotations | default (dict))) }}
  annotations:
    {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 4 }}
  {{- end }}
spec:
  jobLabel: {{ $sm.jobLabel | quote }}
  endpoints:
    - port: metrics
      {{- with $sm.path }}
      path: {{ . }}
      {{- end }}
      {{- with $sm.params }}
      params:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sm.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $sm.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- if $sm.honorLabels }}
      honorLabels: {{ $sm.honorLabels }}
      {{- end }}
      {{- with $sm.relabelings }}
      relabelings:
        {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 8 }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ include "nudgebee.rabbitmq.namespace" . | quote }}
  {{- with $sm.podTargetLabels }}
  podTargetLabels:
    {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 4 }}
  {{- end }}
  {{- with $sm.targetLabels }}
  targetLabels:
    {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nudgebee.rabbitmq.matchLabels" (dict "custom" $r.commonLabels "root" $) | nindent 6 }}
      {{- with $sm.selector }}
      {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 6 }}
      {{- end }}
{{- end }}
{{- if and $r.metrics.enabled $pr.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  namespace: {{ default (include "nudgebee.rabbitmq.namespace" .) $pr.namespace | quote }}
  labels:
    {{- include "nudgebee.rabbitmq.labels" (dict "custom" $r.commonLabels "root" $) | nindent 4 }}
    {{- with $pr.additionalLabels }}
    {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 4 }}
    {{- end }}
  {{- with $r.commonAnnotations }}
  annotations:
    {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 4 }}
  {{- end }}
spec:
  groups:
  {{- with $pr.rules }}
    - name: {{ include "nudgebee.rabbitmq.name" $ }}
      rules:
        {{- include "nudgebee.rabbitmq.tpl" (dict "value" . "root" $) | nindent 8 }}
  {{- end }}
{{- end }}
{{- end }}
