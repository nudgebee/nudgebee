{{- /*
Everything services-server needs to bring a fresh deployment up to a usable
state at startup: the admin address it provisions from, and the credential the
bundled in-cluster agent authenticates with.

A dedicated Secret rather than keys on the main `nudgebee` one, for a reason
that is not obvious: the agent subchart has to be told this Secret's name
through `runner.nudgebee.authSecretKeyFrom`, and subchart values are static —
a parent chart cannot compute them in a template. So the name must be a fixed
literal, which rules out following `global.existingNudgebeeSecretName`. A
dedicated Secret with a fixed name is correct under every configuration; a key
on the main Secret would silently point the agent at the wrong place whenever an
operator brings their own.

Rendered when either half is in use. Both are optional and independent: an
install can pre-provision its admin without bundling an agent, or bundle an
agent and let the first login provision the admin.
*/ -}}
{{- $wantAgent := .Values.agent.enabled -}}
{{- $wantAdmin := .Values.admin.email -}}
{{- if or $wantAgent $wantAdmin }}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace "nudgebee-bootstrap") | default dict }}
{{- $accessKey := "" }}
{{- $accessSecret := "" }}
{{- if $wantAgent }}
  {{- /*
    Lookup-or-generate, with one deliberate difference from
    ACTION_API_SERVER_TOKEN in secrets-nudgebee.yaml: this credential must NOT
    silently regenerate.

    That token is safe to re-roll because every reader gets it from the same
    Secret, so a new value is self-consistent. This one is not. Its two halves
    live in different stores on different clocks — this Secret, and a bcrypt
    hash in Postgres written by services-server. Regenerating here leaves the
    agent holding stale env (changing a secretKeyRef does not restart a pod)
    while Postgres still holds the hash of the old secret, so which pod
    restarts first decides whether the agent can authenticate.

    Offline render (Argo CD, Flux) returns empty from `lookup` on every
    reconcile, which is exactly when that would bite. So: generate on a fresh
    install, and fail loudly on an upgrade that cannot find the existing value —
    the same posture NUDGEBEE_ENCRYPTION_KEY takes, not the softer one.
  */ -}}
  {{- $existingKey := "" }}
  {{- $existingSecret := "" }}
  {{- if $secret.data }}
    {{- if index $secret.data "LOCAL_AGENT_ACCESS_KEY" }}
      {{- $existingKey = index $secret.data "LOCAL_AGENT_ACCESS_KEY" | b64dec }}
    {{- end }}
    {{- if index $secret.data "LOCAL_AGENT_ACCESS_SECRET" }}
      {{- $existingSecret = index $secret.data "LOCAL_AGENT_ACCESS_SECRET" | b64dec }}
    {{- end }}
  {{- end }}
  {{- $accessKey = default $existingKey .Values.agent.accessKey }}
  {{- $accessSecret = default $existingSecret .Values.agent.accessSecret }}
  {{- if or (not $accessKey) (not $accessSecret) }}
    {{- if .Release.IsInstall }}
      {{- $accessKey = default (randAlphaNum 32) $accessKey }}
      {{- $accessSecret = default (randAlphaNum 48) $accessSecret }}
    {{- else }}
      {{- fail "\n\n[ERROR] The bundled agent's credential could not be found and will not be regenerated.\n\nThis is an upgrade, and the existing nudgebee-bootstrap Secret was not readable. Regenerating silently would leave the agent holding one credential while the database holds the hash of another, and whichever pod restarts first would decide whether the agent can authenticate.\n\nIf you render offline (Argo CD, Flux), `lookup` always returns empty and you MUST set both values explicitly:\n\n  agent:\n    accessKey: <existing LOCAL_AGENT_ACCESS_KEY>\n    accessSecret: <existing LOCAL_AGENT_ACCESS_SECRET>\n\nRead them from the live cluster with:\n\n  kubectl get secret nudgebee-bootstrap -n <namespace> \\\n    -o jsonpath='{.data.LOCAL_AGENT_ACCESS_KEY}' | base64 -d\n  kubectl get secret nudgebee-bootstrap -n <namespace> \\\n    -o jsonpath='{.data.LOCAL_AGENT_ACCESS_SECRET}' | base64 -d\n\nIf this is a fresh install into a namespace that already had one, set agent.enabled=false instead.\n" }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: nudgebee-bootstrap
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if $wantAdmin }}
  {{- /*
    Address services-server provisions the first admin from, so the install is
    complete before anyone signs in. Enterprise can leave this empty — the
    licence carries its own address and takes over.
  */}}
  ADMIN_EMAIL: {{ .Values.admin.email | b64enc | quote }}
  {{- end }}
  {{- if $wantAgent }}
  LOCAL_AGENT_CLUSTER_NAME: {{ .Values.agent.clusterName | default "nb-control-plane-k8s" | b64enc | quote }}
  LOCAL_AGENT_ACCESS_KEY: {{ $accessKey | b64enc | quote }}
  LOCAL_AGENT_ACCESS_SECRET: {{ $accessSecret | b64enc | quote }}
  {{- /*
    The combined form the agent's runner expects. Written here rather than
    assembled by the agent so both sides read one generated value.
  */}}
  NUDGEBEE_AUTH_SECRET_KEY: {{ printf "%s:%s" $accessKey $accessSecret | b64enc | quote }}
  {{- end }}
{{- end }}
