global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    # -nb2 rebuilds gosu on Go 1.26.5 (clears 1C/14H Go-stdlib CVEs); fully clean.
    postgres: 'ghcr.io/nudgebee/postgres:16.10-alpine-nb2'
    curl: 'ghcr.io/nudgebee/curl:8.10.1'
  # `helm test` connection pods only (each service chart's
  # templates/tests/test-connection.yaml). A full ref, like initImages above,
  # rather than a repository composed onto global.image.registry: this is a
  # third-party image, so a private-registry install has to mirror it under
  # whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'
  # StorageClass for every PVC the stack creates: postgresql, redis, rabbitmq,
  # clickhouse (bitnami subcharts read this global directly) and qdrant. Empty
  # means each PVC is left without a storageClassName, so the cluster's default
  # StorageClass is used. "-" disables dynamic provisioning (binds a pre-created
  # PV).
  #
  # Set here it WINS over every per-component setting — bitnami's
  # common.storage.class precedence, which our own charts follow so one release
  # can't end up with two behaviours. To give one store a different class, leave
  # this empty and set each component individually:
  #   nudgebee-qdrant-server.persistence.storageClass
  #   postgresql.primary.persistence.storageClass
  #   redis.master.persistence.storageClass / redis.replica.persistence.storageClass
  #   rabbitmq.persistence.storageClass
  #
  # Changing this after install does not move existing PVCs — a bound PVC's
  # storageClassName is immutable. Re-point an installed stack by backing up,
  # deleting the old PVCs, and letting the StatefulSets recreate them.
  storageClass: ''
  existingNudgebeeSecretName: ''
nudgebee_registry_secret:
  enabled: false
  username: 'nudgebee'
  password: ''
  existingSecretName: ''
nudgebee_secret:
  BASE_URL: 'http://localhost:3000'
  EMAIL_FROM: ''
  EMAIL_SERVER_HOST: ''
  EMAIL_SERVER_PASSWORD: ''
  EMAIL_SERVER_USER: ''
  APP_DATABASE_URL: 'postgresql://postgres:password@postgresql:5432/postgres?sslmode=disable'
  # Note: If you change APP_DATABASE_URL, ensure you also update the 'temporal.server.config.persistence' section below
  # to match the host, port, user, and SSL settings.
  # NUDGEBEE_ENCRYPTION_KEY encrypts DB-stored integration credentials and similar
  # at-rest secrets. MUST be set per install (the chart fails if empty or left as
  # __REPLACE__) — regenerating it after data is written makes previously-encrypted
  # rows unreadable, so generate once and store securely. Generate with:
  # openssl rand -hex 32
  NUDGEBEE_ENCRYPTION_KEY: '__REPLACE__'
  NUDGEBEE_LICENSE: ''
  RELAY_SERVER_SECRET_KEY: ''
  AWS_TEMPLATE_URL: 'https://nudgebee-prod-documents.s3.amazonaws.com/nudgebee-aws-cloud-formation.json'
  NUDGEBEE_INSTANCE_ROLE: ''
  AWS_ORG_TEMPLATE_URL: ''
  AWS_ORG_SNS_TOPIC_ARN: ''
  CLOUD_COLLECTOR_ORG_REGISTRATION_SQS: ''
  CLOUD_COLLECTOR_AWS_EVENTBRIDGE_SQS: ''
  NEXTAUTH_DUMMY_CREDS_ENABLED: true
  TEMPORAL_DB_PASSWORD: 'password'
  TEMPORAL_GRPC_ENDPOINT: 'temporal-frontend:7233'

  # ------------------------------------------------------------------
  # Open-source / on-prem configuration knobs.
  # All defaults preserve the existing Nudgebee SaaS behavior; only set
  # these when running an OSS fork or a single-tenant on-prem deployment.
  # ------------------------------------------------------------------

  # RSA public key for verifying NUDGEBEE_LICENSE JWTs (commercial / on-prem).
  # Leave empty for OSS — getLicenseDetails() short-circuits to licenseType='free'.
  LICENSE_PUBLIC_KEY: ''

  # Azure AD application (client) ID for /.well-known/microsoft-identity-association.json.
  # Leave empty for OSS / dev — the endpoint will return an empty associations array.
  MICROSOFT_IDENTITY_APPLICATION_ID: ''

  # Contact address rendered in the marketplace on-prem / license-only response
  # HTML pages. When unset, the page degrades to a generic "team will get in touch"
  # line with no mailto link.
  MARKETPLACE_CONTACT_EMAIL: ''

  # Public origin of the app, used as a fallback for OAuth redirect URIs and
  # email links when BASE_URL is not set.
  NEXT_PUBLIC_APP_URL: ''

  # Base URL of the public docs site, used by in-app "Learn more" links.
  # Empty value lets the app fall back to its baked-in default (https://docs.nudgebee.com).
  NEXT_PUBLIC_DOCS_URL: ''

  # Default Docker image registry pre-filled in the K8s installer modal.
  # OSS deployments should set this to 'ghcr.io/nudgebee' (or your own
  # mirror). The app has no baked-in fallback — if this is empty, the
  # installer modal will show "undefined" in the placeholder. EE installs
  # override to their internal registry via values-enterprise.yaml.
  NEXT_PUBLIC_DEFAULT_IMAGE_REGISTRY: 'ghcr.io/nudgebee'


postgresql:
  enabled: true
  fullnameOverride: postgresql
  auth:
    existingSecret: 'postgresql'
    database: 'postgres'
  # Bitnami postgresql chart 13.2.25 defaults primary.persistence.size to 8Gi
  # (see charts/postgresql-13.2.25.tgz values.yaml). 8Gi fills quickly under
  # real workloads; bump the default PVC request to 50Gi. Note: resizing an
  # already-bound PVC requires the underlying StorageClass to allow expansion.
  primary:
    persistence:
      size: 50Gi
  # Pin to the GHCR mirror of bitnami/postgresql:16.1.0-debian-11-r16.
  # Same tag the bitnami chart 13.2.25 already defaults to, but the original
  # docker.io/bitnami/postgresql path was deprecated in Bitnami's mid-2025
  # sunset (images moved to docker.io/bitnamilegacy/*). Without this override
  # the chart's default image-pull 404s.
  image:
    registry: 'ghcr.io/nudgebee'
    repository: postgresql
    tag: '16.1.0-debian-11-r16-nb1'
  metrics:
    enabled: true
    # Upstream prometheus-community postgres_exporter (distroless), mirrored to
    # ghcr. Replaces the frozen bitnamilegacy build whose stale Go binary +
    # debian-11 base carried 2 CRITICAL / 35 HIGH fixable that apt-upgrade could
    # not clear. Drop-in for the bitnami chart's metrics sidecar (same
    # DATA_SOURCE_* env, verified pg_up=1). NOTE: v0.20.x renamed two metrics the
    # alert rules below depend on — updated in PostgresReplicationLag /
    # PostgresLongRunningQuery.
    image:
      registry: 'ghcr.io/nudgebee'
      repository: postgres-exporter
      tag: 'v0.20.1-nb1'
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      additionalRules:
        - name: postgres.rules
          groups:
            - name: postgres.rules
              rules:
                - alert: PostgresInstanceDown
                  expr: up{job="postgresql"} == 0
                  for: 2m
                  labels:
                    severity: critical
                  annotations:
                    summary: 'PostgreSQL instance is down'
                    description: 'No metrics received from PostgreSQL (instance: {{ $labels.instance }})'

                - alert: PostgresTooManyConnections
                  expr: pg_stat_activity_count{job="postgresql"} > 100
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: 'PostgreSQL too many connections'
                    description: 'Instance {{ $labels.instance }} has over 100 active connections'

                # prometheus-community v0.20 renamed pg_replication_lag ->
                # pg_replication_lag_seconds (seconds). The old expr `> 10000000`
                # with a "> 10MB" byte-oriented description never fired against a
                # seconds metric (10M s = 115 days); use a 300s (5 min) lag
                # threshold. TODO(ops): confirm the desired replication-lag SLO.
                - alert: PostgresReplicationLag
                  expr: pg_replication_lag_seconds{job="postgresql"} > 300
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: 'PostgreSQL replication lag detected'
                    description: 'Replication lag on {{ $labels.instance }} > 5 minutes'

                # prometheus-community v0.20 renamed pg_stat_activity_max_tx_duration_seconds
                # -> pg_stat_activity_max_tx_duration (still seconds; 300 = 5 min).
                - alert: PostgresLongRunningQuery
                  expr: pg_stat_activity_max_tx_duration{job="postgresql"} > 300
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: 'Long-running query'
                    description: 'A query has been running > 5 minutes on {{ $labels.instance }}'

clickhouse:
  enabled: false
  fullnameOverride: clickhouse
  shards: 2
  replicaCount: 1
  auth:
    existingSecret: 'clickhouse'
    existingSecretKey: 'admin-password'
redis:
  enabled: true
  fullnameOverride: redis
  # Pin to the GHCR mirror — bitnami chart 17.11.8 defaults at
  # docker.io/bitnami/redis are dead since Bitnami's mid-2025 sunset
  # (moved to docker.io/bitnamilegacy/*).
  image:
    registry: 'ghcr.io/nudgebee'
    repository: redis
    # -nb2 rebuilds the bitnami wait-for-port startup helper on Go 1.26.5,
    # clearing 2 CRITICAL + 19 HIGH + 43 MEDIUM Go-stdlib CVEs a debian apt
    # upgrade can't touch. Residual is the debian-11 NOFIX OS floor only.
    tag: 7.0.12-debian-11-r0-nb2
  auth:
    password: 'password'
    existingSecret: 'redis'
    existingSecretPasswordKey: 'redis-password'
  replica:
    replicaCount: 0
rabbitmq:
  enabled: true
  fullnameOverride: rabbitmq
  image:
    registry: 'ghcr.io/nudgebee'
    repository: rabbitmq
    tag: 3.13.7-debian-12-r5-nb1
  extraConfiguration: |-
    consumer_timeout = 3600000
  auth:
    password: 'password'
    securePassword: false
    existingPasswordSecret: 'rabbitmq'
    existingErlangSecret: 'rabbitmq'
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      path: /metrics/per-object
    prometheusRule:
      enabled: true
      rules:
        - alert: RabbitmqNodeDown
          expr: 'sum(rabbitmq_build_info{namespace="{{ .Release.Namespace }}"}) < {{ .Values.replicaCount }}'
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: RabbitMQ node down
            description: 'Less than {{ .Values.replicaCount }} nodes running in RabbitMQ cluster'
        - alert: RabbitmqInstancesDifferentVersions
          expr: 'count(count(rabbitmq_build_info{namespace="{{ .Release.Namespace }}"}) by (rabbitmq_version)) > 1'
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: RabbitMQ instances different versions
            description: 'Running different version of RabbitMQ in the same cluster, can lead to failure.'
        - alert: RabbitmqMemoryHigh
          expr: 'rabbitmq_process_resident_memory_bytes{namespace="{{ .Release.Namespace }}"} / rabbitmq_resident_memory_limit_bytes{namespace="{{ .Release.Namespace }}"} * 100 > 90'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RabbitMQ memory high
            description: 'A node use more than 90% of allocated RAM'

        - alert: RabbitmqFileDescriptorsUsage
          expr: 'rabbitmq_process_open_fds{namespace="{{ .Release.Namespace }}"} / rabbitmq_process_max_fds{namespace="{{ .Release.Namespace }}"} * 100 > 90'
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: RabbitMQ file descriptors usage
            description: 'A node use more than 90% of file descriptors'

        - alert: RabbitmqTooManyReadyMessages
          expr: 'sum(rabbitmq_queue_messages_ready{namespace="{{ .Release.Namespace }}"}) BY (queue, pod, namespace) > 100'
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'RabbitMQ queue {{`{{ $labels.queue }}`}} has too many ready messages'
            description: 'Queue {{`{{ $labels.queue }}`}} in namespace {{`{{ $labels.namespace }}`}} (pod {{`{{ $labels.pod }}`}}) has more than 100 ready messages'

        - alert: RabbitmqTooManyUnackMessages
          expr: 'sum(rabbitmq_queue_messages_unacked{namespace="{{ .Release.Namespace }}"}) BY (queue, pod, namespace) > 100'
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'RabbitMQ queue {{`{{ $labels.queue }}`}} has too many unacked messages'
            description: 'Queue {{`{{ $labels.queue }}`}} in namespace {{`{{ $labels.namespace }}`}} (pod {{`{{ $labels.pod }}`}}) has more than 100 unacknowledged messages'

        - alert: RabbitmqTooManyConnections
          expr: 'rabbitmq_connections{namespace="{{ .Release.Namespace }}"} > 100'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RabbitMQ too many connections
            description: 'The total connections of a node is too high'

        - alert: RabbitmqNoQueueConsumer
          expr: 'rabbitmq_queue_consumers{namespace="{{ .Release.Namespace }}",queue!~".*(dlq|relay|notifications_delayed).*"} < 1'
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'RabbitMQ queue {{`{{ $labels.queue }}`}} has no consumers'
            description: 'Queue {{`{{ $labels.queue }}`}} in namespace {{`{{ $labels.namespace }}`}} (pod {{`{{ $labels.pod }}`}}) has less than 1 consumer'

        - alert: RabbitmqUnroutableMessages
          expr: 'increase(rabbitmq_channel_messages_unroutable_returned_total{namespace="{{ .Release.Namespace }}"}[1m]) > 0 or increase(rabbitmq_channel_messages_unroutable_dropped_total{namespace="{{ .Release.Namespace }}"}[1m]) > 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: RabbitMQ unroutable messages
            description: 'A queue has unroutable messages'
# ---------------------------------------------------------------------------
# Install-time setup. Both parts are optional and independent: an install can
# pre-provision its admin without bundling an agent, or bundle an agent and let
# the first login provision the admin.
# ---------------------------------------------------------------------------

admin:
  # Address the first admin is created from at startup, so the deployment is
  # complete when `helm install` returns rather than half-configured until
  # somebody signs in. The tenant is named after it ("admin@acme.com" ->
  # "admin's Org"), matching what first-login provisioning would have produced.
  #
  # Leave empty to keep today's behaviour: everything is provisioned by the
  # first login instead. Enterprise can leave it empty regardless — the licence
  # carries its own address and takes over.
  #
  # Sign in with this address and the generated password:
  #   kubectl get secret nudgebee -n <ns> \
  #     -o jsonpath='{.data.NEXTAUTH_DUMMY_CREDS_PASSWORD}' | base64 -d
  email: ''

agent:
  # Install the NudgeBee agent alongside the server and connect the cluster
  # hosting it, so the first cluster needs no second install and no copied auth
  # key. Additional clusters keep the normal two-step flow.
  #
  # Defaults to false so an upgrade never silently gains a privileged eBPF
  # DaemonSet across its nodes, or a duplicate account for a cluster it already
  # monitors. New installs should set it true — the quickstart values file in
  # the install guide does.
  enabled: false
  # Name this cluster appears under — the cluster hosting the NudgeBee control
  # plane. More than 3 characters; "Demo" is reserved.
  clusterName: 'nb-control-plane-k8s'
  # GitOps only. Offline render (Argo CD, Flux) cannot read the existing
  # credential back, so the chart refuses to guess on upgrade — set both from
  # the live Secret. Leave empty for ordinary `helm install` / `helm upgrade`.
  accessKey: ''
  accessSecret: ''

services-server:
  fullnameOverride: services-server
  # Carries ADMIN_EMAIL and the bundled agent's credential when either is in use.
  extraEnvFromSecret: 'nudgebee-bootstrap'
  env:
    NOVA_IMAGE: 'ghcr.io/nudgebee/nova:2026-05-22T07-15-34_decaacbbf56e1789c3299a89f790b8e824ab741c'
    TRIVY_IMAGE: 'ghcr.io/nudgebee/trivy:0.58.0'
    POPEYE_IMAGE: 'ghcr.io/nudgebee/popeye:v0.11.1-nudgebee.1'
    KUBE_BENCH_IMAGE: 'ghcr.io/nudgebee/kube-bench:v0.10.4'
k8s-collector:
  fullnameOverride: k8s-collector
relay-server:
  fullnameOverride: relay-server
app:
  fullnameOverride: app
  replicaCount: 1
notifications:
  enabled: true
  fullnameOverride: notifications
ticket-server:
  enabled: true
  fullnameOverride: ticket-server
ml-k8s-server:
  enabled: true
  fullnameOverride: ml-server
postgres_migrations:
  fullnameOverride: postgres_migrations
  image:
    repository: migrations
    tag: latest
llm-server:
  enabled: true
  fullnameOverride: llm-server
  env:
    LLM_SERVER_AGENT_CODEAGENT_IMAGE: 'ghcr.io/nudgebee/code-analysis-agent:latest'
    LLM_SERVER_AGENT_CODEAGENT_IMAGE_PULL_SECRET: ''
rag-server:
  enabled: true
  fullnameOverride: rag-server
cloud-collector-server:
  enabled: true
  fullnameOverride: cloud-collector-server
nudgebee-qdrant-server:
  enabled: true
  fullnameOverride: nudgebee-qdrant-server
  image:
    # ghcr clone of docker.io/qdrant/qdrant — avoids Docker Hub rate limits.
    # Copied via deploy/kubernetes/nudgebee-mirrors/clone-third-party.sh (crane).
    repository: ghcr.io/nudgebee/qdrant
    tag: 'v1.19.0'
temporal:
  enabled: true
  fullnameOverride: temporal
  # The upstream temporal chart defaults every image to docker.io/temporalio/*.
  # Repointed at our ghcr clones (same digests, copied by
  # nudgebee-mirrors/clone-third-party.sh) so the chart pulls nothing from Docker
  # Hub — no anonymous rate limits, one registry to allow-list. These are clones,
  # NOT rebuilds: the upstream CVE floor comes with them, and the fix is still a
  # version bump. Keep the tags in step with the chart version in Chart.yaml —
  # the subchart's defaults are what these override, so a chart bump that moves
  # the default tag needs the clone + these values bumped together.
  web:
    image:
      repository: ghcr.io/nudgebee/temporal-ui
      tag: '2.52.0'
    # Disabled: the Temporal Web UI is a standalone read-only dashboard that no
    # nudgebee component references (workflow-server talks to temporal-frontend:7233,
    # not the UI; no ingress or app link points at it). Removing it drops the
    # temporalio/ui image entirely — and with it 31 HIGH + 18 MEDIUM upstream
    # Go-dep CVEs that no version bump clears (verified: ui 2.52.1 is unchanged).
    # Re-enable if operators want the dashboard for debugging.
    enabled: false
  admintools:
    image:
      repository: ghcr.io/nudgebee/temporal-admin-tools
      tag: '1.31.2'
    # Disabled: the admintools Deployment is only a standing shell with the
    # temporal/tctl CLI for operators to exec into — no nudgebee component uses
    # it (workflow-server talks to temporal-frontend:7233 via SDK). Schema
    # create/setup/update jobs and namespace bootstrap run the admin-tools
    # image transiently regardless of this flag (gated on schema.* below), so
    # migrations still work. Re-enable ad hoc for tctl debugging:
    #   helm upgrade ... --set temporal.admintools.enabled=true
    enabled: false
  shims:
    # Disabled: the chart's dockerize / temporal-elasticsearch-tool shims exist
    # only for Temporal 1.29 images ("Set to false if using Temporal 1.30 or
    # higher" per the subchart values); we run 1.31.2, and with elasticsearch
    # disabled nothing mounts them. Keeping them enabled also breaks upgrades
    # from chart 1.3.0: with schema.useHelmHooks=true the shims ConfigMap was
    # created as a pre-install/pre-upgrade hook (hooks carry no Helm ownership
    # metadata and its delete policy leaves it behind), so once useHelmHooks
    # went false the same ConfigMap re-rendered as a normal resource and every
    # upgrade failed with `ConfigMap "temporal-shims" exists and cannot be
    # imported into the current release: invalid ownership metadata`. With both
    # shims off the ConfigMap is not rendered at all, so the orphan is simply
    # ignored (inert leftover, safe to delete by hand).
    dockerize: false
    elasticsearchTool: false
  schema:
    # Run schema setup/update as a normal Job, NOT a Helm hook.
    #
    # postgres and the `nudgebee-temporal` secret are bundled in THIS release as
    # plain (non-hook) resources. The temporal chart defaults useHelmHooks=true,
    # which runs the schema Job as a pre-install/pre-upgrade hook — i.e. BEFORE
    # those plain resources are created. The hook then fails with
    # `secret "nudgebee-temporal" not found`, never completes, and deadlocks the
    # entire release in `pending-install` (nothing else, postgres included, ever
    # gets applied). Setting false makes it a normal Job that Helm applies
    # alongside the secret + postgres; it retries (backoffLimit below) until they
    # are reachable. Documented by the chart as the setting for GitOps / any
    # flow that can't rely on hook ordering.
    useHelmHooks: false
  server:
    image:
      repository: ghcr.io/nudgebee/temporal-server
      tag: '1.31.2'
    enabled: true
    replicaCount: 1
    dynamicConfig:
      limit.customSearchAttributes.keyword:
        - value: 100
          constraints: {}
      frontend.validSearchAttributes:
        - value:
            nb_tenant_id: 'Keyword'
            nb_account_id: 'Keyword'
            nb_workflow_id: 'Keyword'
            nb_workflow_trigger: 'Keyword'
            nb_triggered_by: 'Keyword'
            parent_workflow_id: 'Keyword'
            parent_run_id: 'Keyword'
            nb_execution_tags: 'KeywordList'
            nb_event_type: 'Keyword'
            nb_event_id: 'Keyword'
            nb_parent_workflow_id: 'Keyword'
    config:
      namespaces:
        create: true
        namespace:
          - name: default
            retention: 10d
      # Temporal helm chart 1.x restructured persistence: stores live under
      # datastores.<name>.sql (raw server-config format), selected via
      # defaultStore / visibilityStore. numHistoryShards MUST stay 512 — the value
      # the existing deployment initialised with; it cannot be changed. createDatabase
      # is true so a fresh install with bundled postgres creates the temporal /
      # temporal_visibility DBs (nothing else does — bundled postgres only inits the
      # `postgres` DB). temporal-sql-tool create-database is idempotent for postgres
      # (temporalio/temporal#2104), so this is a safe no-op where the DBs already
      # exist (e.g. an existing deployment). manageSchema true lets the schema job
      # run setup-schema/update-schema (also idempotent) to migrate on every deploy.
      persistence:
        defaultStore: default
        visibilityStore: visibility
        numHistoryShards: 512
        datastores:
          default:
            sql:
              pluginName: postgres12
              connectAddr: 'postgresql:5432'
              connectProtocol: 'tcp'
              databaseName: temporal
              user: 'postgres'
              existingSecret: 'nudgebee-temporal'
              createDatabase: true
              manageSchema: true
          visibility:
            sql:
              pluginName: postgres12
              connectAddr: 'postgresql:5432'
              connectProtocol: 'tcp'
              databaseName: temporal_visibility
              user: 'postgres'
              existingSecret: 'nudgebee-temporal'
              createDatabase: true
              manageSchema: true
workflow-server:
  enabled: true
  fullnameOverride: workflow-server
cost-server:
  enabled: true
  fullnameOverride: cost-server
llm-gateway:
  enabled: false
  fullnameOverride: llm-gateway

# Passthrough to the bundled agent subchart. Everything the upstream chart
# accepts can be set here; only the credential wiring is fixed by us.
nudgebee-agent:
  # Do not assert that a Prometheus operator exists. The agent chart renders its
  # ServiceMonitor / PodMonitor / PrometheusRule when this is true OR when the
  # CRDs are actually registered; false leaves the capability check in charge, so
  # a cluster with the operator still gets them and one without installs cleanly.
  # The bundled install targets both.
  enablePrometheusStack: false
  runner:
    # Must be off together with the collector below. The runner's
    # CLICKHOUSE_PASSWORD env renders when EITHER the collector is enabled OR
    # this is true, and it is a secretKeyRef into the ClickHouse subchart's
    # Secret. Disabling only the collector leaves that reference pointing at a
    # Secret that no longer exists, and the runner sits in
    # CreateContainerConfigError forever. Found by installing, not by rendering.
    clickhouse_enabled: false
    nudgebee:
      # Reads the credential from the Secret this chart generates, so the agent
      # has it the moment its pod starts and nothing has to be ordered.
      authSecretKeyFrom:
        name: nudgebee-bootstrap
        key: NUDGEBEE_AUTH_SECRET_KEY
      # Short service names on purpose: the agent is deployed into this release's
      # namespace, and Kubernetes DNS resolves same-namespace Services without a
      # suffix. Qualifying them with a namespace would pin the agent to whatever
      # namespace was hardcoded here, so an install into any other one would
      # point at a DIFFERENT deployment's collector and relay. Override both
      # when the agent reaches the server through ingress.
      endpoint: 'http://k8s-collector/'
    relay_address: 'ws://relay-server:8080/register'
  globalConfig:
    # Empty lets the agent autodiscover Prometheus in the cluster. We never
    # install one; the agent runs without it and reports reduced capability.
    prometheus_url: ''
  # Tracing and profiling storage is off for the bundled agent. Two reasons,
  # both about the first install: it brings a ClickHouse StatefulSet with a
  # large PVC, which is a lot to impose on someone trying the product; and the
  # Bitnami subchart refuses to render on `helm upgrade` unless the existing
  # passwords are passed back in, which would break every upgrade of a bundled
  # install. Inventory, events, logs and metrics are unaffected. Turn it on
  # deliberately, and supply the ClickHouse credentials when upgrading.
  opentelemetry-collector:
    enabled: false
  # The node agent is off for the same first-install reason, and the two belong
  # together. It is a privileged eBPF DaemonSet on every node, which plenty of
  # clusters will not admit under Pod Security Admission -- a poor thing to
  # impose on someone whose first act is trying the product. And with the
  # collector above disabled there is nowhere for the traces, logs and profiles
  # it pushes to go, so what remains is scrape-only eBPF metrics that need both
  # a Prometheus and a monitor CR to be consumed at all.
  #
  # What turning it on adds: network metrics and the service map (both of which
  # also need Prometheus), plus traces and profiles once the collector is on.
  nodeAgent:
    enabled: false
  clickhouse:
    # Belt and braces: the subchart is conditioned on the collector above, but
    # its monitoring CRs are values-gated and a cluster may have no Prometheus
    # operator to accept them.
    metrics:
      serviceMonitor:
        enabled: false
