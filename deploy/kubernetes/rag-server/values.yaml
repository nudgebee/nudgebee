# Default values for rag-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.10-alpine'
    curl: 'ghcr.io/nudgebee/curl:8.10.1'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'

replicaCount: 1

image:
  # -- Name of the image repository to pull the container image from.
  repository: nudgebee-rag-server
  # -- [Image pull policy](https://kubernetes.io/docs/concepts/containers/images/#updating-images) for updating already existing images on a node.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

imagePullSecrets: [ ]
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: { }
podLabels: { }

podSecurityContext:
  { }
# fsGroup: 2000

securityContext:
  { }
  # capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 9999

serverPort: 9999

ingress:
  enabled: false
  className: ''
  annotations:
    { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [ ]
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # rag-server loads a cross-encoder reranker in-process (~490MB resident) on top
  # of ~556Mi baseline, so steady state is ~1Gi. The request is deliberately above
  # that at 1.5Gi so the scheduler reserves headroom rather than the bare figure;
  # the 4Gi limit absorbs retrieval bursts. Do not lower the request to 1Gi.
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1536Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: { }

tolerations: [ ]

affinity: { }

labels:
  app: rag-server

secretName: 'nudgebee'

env:
  UVICORN_WORKERS: 1
  # glibc hands each thread its own arena and returns freed memory to the arena
  # rather than the OS, so RSS ratcheted to the high-water mark of concurrent
  # inference: 28 arenas held ~1.8GB of freed activations and the pod OOMKilled.
  MALLOC_ARENA_MAX: 2

  # Reranker. Measured against 76 real user questions on dev, with every
  # returned document graded by whether it actually answers the question:
  #
  #   ms-marco-MiniLM-L-6-v2 vs the previous BAAI/bge-reranker-v2-m3
  #     4.8x faster, same answers, 1.1GB less resident memory.
  #   max_length 128 vs 256
  #     reranking 186ms -> 92ms, precision 35% -> 36%. Reading more of each
  #     document scored WORSE, not better: this model was trained on short
  #     MS MARCO passages, and the ingest pipeline already chunks documents to
  #     roughly that size, so a wider window mostly reads past the chunk. 512
  #     was measured too - 4.6x the CPU of 128 for fewer good documents.
  #   threshold 0.85
  #     unchanged. Swept 0.01/0.05/0.30/0.85 against the live server: 0.85
  #     answers 7 of 15 answerable questions with 4 of 61 unanswerable ones
  #     getting noise; 0.05 answers 13 but noises 19. 0.85 is the better trade
  #     unless a missed answer is judged >2x worse than a misleading one.
  RAG_RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
  RAG_RERANKER_THRESHOLD: '0.85'
  RAG_RERANKER_MAX_LENGTH: 128
  RAG_RERANKER_MAX_DOC_CHARS: 500

# ---------------------------------------------------------------------------
# Running embeddings on the pod instead of calling a provider API
#
# Deliberately NOT enabled by default. It is a one-way data migration, not a
# config change: vectors are only comparable within one model, so switching
# rebuilds every collection and cannot be rolled back by flipping the flag.
#
# What it buys (measured on dev): query embedding 13ms instead of a network
# round trip, no per-API-key rate limit (retrieval flatlined at ~15 searches/sec
# on the API), and 8x smaller vectors (3072 -> 384 dimensions), which matters
# because Qdrant runs on 500m CPU / 1Gi. Retrieval quality measured equivalent:
# 82% vs 84% recall@10 on the knowledge base, and no regression on prometheus
# or the memory collections. kubectl was the one weak spot: 87% vs 96%.
#
# To enable, per environment and in this order:
#   1. EMBEDDINGS_PROVIDER: ondevice
#      EMBEDDINGS_MODEL_NAME: BAAI/bge-small-en-v1.5
#   2. RAG_EMBEDDING_MIGRATION_ENABLED: 'true'
#      On the next start the service registers every collection whose recorded
#      embedding model differs from the configured one, then rebuilds them on a
#      background thread -- startup is not held up, and a collection still in
#      the queue keeps behaving as it did until its turn comes. Each rebuild
#      stages a full copy before dropping the original, so an interrupted run
#      resumes rather than losing data, and each account is rebuilt with that
#      account's own configured model.
#
#      Collections record the model that produced their vectors, because
#      dimension alone cannot tell you whether they match: bge-small-en-v1.5
#      and all-MiniLM-L6-v2 are both 384. Collections created before that stamp
#      existed are treated as current when their dimension already matches.
#
#      Budget roughly an hour per 35k vectors. Watch for
#      "embedding_migration: done" in the log and turn the flag back off once
#      it reports registered=0.
#
# Do NOT set EMBEDDINGS_PROVIDER without the migration flag: queries land in
# the new space while the stored vectors are still in the old one, and every
# search returns nothing.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CPU requirements for the knowledge-base reranker
#
# rag-server scores document relevance with a model that runs on the CPU, so the
# node's instruction set decides how fast it is. Nothing here is required to run
# -- the service works on any x86-64 or ARM node -- but it decides whether
# RAG_RERANKER_DTYPE=bfloat16 is worth enabling.
#
#   Intel Sapphire Rapids / Emerald Rapids or newer (AMX-BF16), or any CPU with
#   AVX512-BF16   -> bfloat16 is accelerated in hardware. Halves the memory the
#                    model needs and should be faster than the float32 default.
#
#   Anything older, or ARM   -> bfloat16 is emulated in software. It still halves
#                    the memory but was measured 6-10x SLOWER than float32.
#                    Leave RAG_RERANKER_DTYPE unset (float32) on these nodes.
#
# You do not need to look any of this up. At startup the service times a small
# bfloat16 operation against float32 on whatever CPU it landed on and logs the
# verdict, so check the rag-server log after enabling it:
#   "Loading reranker at bfloat16, accelerated by this CPU"   -> keep it on
#   "...this CPU runs bfloat16 slower than float32..."        -> turn it off
# The check measures the machine rather than reading a chip model, so it is
# correct on Intel, AMD and ARM alike, and on hardware newer than this comment.
#
# Dev runs Intel Xeon Platinum 8581C (Emerald Rapids), which has AMX-BF16.
# On-prem installs vary, which is why the default stays float32 everywhere.
# ---------------------------------------------------------------------------
