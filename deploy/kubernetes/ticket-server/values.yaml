# Default values for ticket-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nudgebee-ticket-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.15-alpine-nb1'
    curl: 'ghcr.io/nudgebee/curl:8.23.0'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

# Delays SIGTERM so kube-proxy has time to stop routing new traffic here first.
lifecycle:
  preStop:
    exec:
      command: ['sleep', '10']

# Must cover the preStop sleep (10s) + shutdownTimeout in main.go (35s).
terminationGracePeriodSeconds: 45

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Small-tier defaults. See docs/sizing-and-tiers.md.
# The smallest service in the platform: 7-22Mi average, 47Mi peak, CPU at or below
# 2m on every measured deployment.
resources:
  limits:
    cpu: 200m
    memory: 250Mi
  requests:
    cpu: 25m
    memory: 50Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

secretName: "nudgebee"

# Additional volumes on the output Deployment definition.
volumes: []

# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}