# -- The number of replicas (pods) to launch
replicaCount: 1

serverPort: 9999

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.15-alpine-nb1'
    curl: 'ghcr.io/nudgebee/curl:8.23.0'

image:
  # -- Name of the image repository to pull the container image from.
  repository: nudgebee-ml-k8s-server
  # -- [Image pull policy](https://kubernetes.io/docs/concepts/containers/images/#updating-images) for updating already existing images on a node.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'
# -- Reference to one or more secrets to be used when [pulling images](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/#create-a-pod-that-uses-your-secret) (from private registries).
imagePullSecrets: []
# -- A name in place of the chart name for `app:` labels.
nameOverride: ''
# -- A name to substitute for the full names of resources.
fullnameOverride: ''

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: false
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ''

# -- Labels to be added to pods.
podLabels: {}

# -- Annotations to be added to pods.
podAnnotations: {}

# -- Pod [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context) for details.
podSecurityContext:
  {}
  # fsGroup: 2000

# -- Container [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1) for details.
securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Kubernetes [service type](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types).
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Annotations to be added to the service.
  annotations: {}

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: ''
  # -- Annotations to be added to the ingress.
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress host configuration.
  # @default -- See [values.yaml](values.yaml).
  hosts:
    - host: compliance.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - webapp-example.local

# -- Container resource [requests and limits](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#resources) for details.
# @default -- No requests or limits.
# Small-tier defaults. See docs/sizing-and-tiers.md.
# Memory grows with the number of workloads analysed: 818Mi-1.75Gi average and
# 1.4-4.4Gi peak across measured deployments. It is bursty but bounded — the
# process does release (sawtooth, not a ramp) — so the limit carries the headroom
# and the request tracks the average.
# The 4Gi limit is unchanged from before. Measurement alone would have justified
# 3Gi at Small, but a 4.4Gi peak was measured on a medium estate and OOM-killed
# there, and lowering a ceiling is not something this chart does — see the
# "never lower a memory limit" rule in docs/sizing-and-tiers.md.
# values-medium/large.yaml raise it to 5Gi/6Gi.
# CPU: p95 is 338-681m with brief 1.7-core peaks; the old 1200m request reserved
# more than the p95 of the largest deployment.
#
# NOTE — the memory request below is NOT what a default install actually gets.
# PR #37330 added an umbrella-level override in nudgebee/values.yaml pinning this
# service to request = limit = 4Gi (Guaranteed QoS) after a live OOM, and a parent
# chart's values beat a subchart's. So at Small the effective request is 4Gi, not
# the 1.5Gi here; values-medium/large.yaml are read after the umbrella and do take
# effect, which leaves Small reserving MORE memory than Medium or Large. That
# inversion is known and deliberate for now — see "Known tier inversion" in
# docs/sizing-and-tiers.md. Do not "fix" the numbers here without also removing
# the umbrella override, or you will just move the surprise somewhere else.
resources:
  limits:
    cpu: '2000m'
    memory: '4Gi'
  requests:
    cpu: '200m'
    memory: '1.5Gi'

# -- Autoscaling by resources
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

# -- [Node selector](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector) configuration.
nodeSelector: {}

# -- [Tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/) for node taints.
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling) for details.
tolerations: []

# -- [Affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity) configuration.
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling) for details.
affinity: {}

secretName: 'nudgebee'

annotations: {}
