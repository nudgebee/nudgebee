# -- The number of replicas (pods) to launch
replicaCount: 2

serverPort: 3000

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []

image:
  # -- Name of the image repository to pull the container image from.
  repository: nudgebee-app
  # -- [Image pull policy](https://kubernetes.io/docs/concepts/containers/images/#updating-images) for updating already existing images on a node.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'
# -- Reference to one or more secrets to be used when [pulling images](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/#create-a-pod-that-uses-your-secret) (from private registries).
imagePullSecrets: []
# -- A name in place of the chart name for `app:` labels.
nameOverride: ''
# -- A name to substitute for the full names of resources.
fullnameOverride: ''

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: false
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ''

# -- Labels to be added to pods.
podLabels: {}

# -- Annotations to be added to pods.
podAnnotations: {}

# -- Pod [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context) for details.
podSecurityContext:
  {}
  # fsGroup: 2000

# -- Container [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1) for details.
securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Kubernetes [service type](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types).
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Annotations to be added to the service.
  annotations: {}

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: 'nginx'
  # -- Annotations to be added to the ingress.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "660"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "660"

  # -- Ingress host configuration.
  # @default -- See [values.yaml](values.yaml).
  hosts: []
  # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []

# -- Container resource [requests and limits](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#resources) for details.
# @default -- No requests or limits.
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    #cpu: 100m
    memory: 1Gi
  requests:
    #cpu: 100m
    memory: 384Mi

# -- Autoscaling by resources
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 10
  targetMemoryUtilizationPercentage: 10

# -- [Node selector](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector) configuration.
nodeSelector: {}

# -- [Tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/) for node taints.
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling) for details.
tolerations: []

# -- [Affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity) configuration.
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling) for details.
affinity: {}

# -- extraEnvVarsCM append to ConfigMap with extra environment variables. See [values.yaml](values.yaml).
## E.g:
## extraEnvVarsCM:
##   ENV_STORE_IN_CONFIGMAP: value
extraEnvVarsCM: {}

# -- extraEnvVarsSecret append to Secret with extra environment variables. See [values.yaml](values.yaml).
## E.g:
## extraEnvVarsSecret:
##   ENV_STORE_IN_SECRET: value
extraEnvVarsSecret: {}

secretName: 'nudgebee'

# -- Operator-posted incident notice shown on /status ("Investigating", "Fix in
# progress", "Scheduled maintenance"). Probes can report that a service is down;
# only a human can say a fix is underway, so the notice is authored, not sensed.
#
# Point this at a ConfigMap holding a single `notice.json` key. It is
# deliberately NOT templated by this chart: an incident notice is edited live,
# and a chart-managed ConfigMap would be reverted by the next `helm upgrade`.
# Create and edit it out-of-band instead; it may be absent (the normal state):
#
#   kubectl create configmap app-status-notice \
#     --from-file=notice.json=./notice.json --dry-run=client -o yaml | kubectl apply -f -
#
# notice.json:
#   {
#     "state": "identified",              # investigating | identified | monitoring | maintenance
#     "components": ["automation"],       # omit/empty = whole system
#     "message": "Workflow execution is delayed. A fix is rolling out.",
#     "started_at": "2026-07-17T09:00:00Z"
#   }
#
# Only `maintenance` may override a probe result; the other states annotate
# without ever turning a red component green.
statusNotice:
  configMapName: ''

# -- Tenant brand kits (white-label logo, favicon, assistant icons) mounted at
# runtime. Brand assets are deliberately NOT baked into the image: only
# `app/public/branding/default/` is committed (see `app/.gitignore`), so a
# white-label deployment supplies its own kits as ConfigMaps and this chart
# mounts them plus tells the app which kit answers which hostname.
#
# One deployment can serve several partner hostnames: list every kit under
# `tenants`, then map hostnames to slugs under `hostMap`. A request arriving on
# a mapped host renders that kit; anything else falls back to `defaultTenant`,
# and with no `defaultTenant` to Nudgebee. The map is read per request from
# `X-Forwarded-Host`, so nothing needs a restart when traffic shifts between
# hostnames.
#
# Create each ConfigMap out-of-band, one key per file:
#
#   kubectl create configmap <tenant>-branding \
#     --from-file=./branding/<tenant> --dry-run=client -o yaml | kubectl apply -f -
#
# ConfigMap keys must match `[-._a-zA-Z0-9]+`, so **brand asset filenames
# cannot contain spaces** — a kit with `Assistant icon.svg` in it cannot be
# stored as a ConfigMap at all. Rename before creating the ConfigMap.
#
# Only the app container gets the mounts. The nginx sidecar aliases `/public/`
# at its own copy of the static tree, but branding URLs are `/branding/<tenant>/…`,
# which falls through to `location /` and is proxied to Next.js — so the app
# container's filesystem is what serves them.
branding:
  # -- Mount the brand kits below and configure per-host brand selection.
  enabled: false
  # -- Brand kits to mount. Each entry mounts `configMapName` at
  # `/app/public/branding/<slug>/`, served at `/branding/<slug>/<file>`; the
  # theme file inside must be named `theme.json`. `slug` also becomes part of a
  # Kubernetes volume name, so keep it to a lowercase DNS label (`[a-z0-9-]`).
  # @default -- `[]`
  tenants: []
  #  - slug: acme
  #    configMapName: acme-branding
  # -- Hostname -> tenant slug. A request on a listed host renders that kit.
  # Every slug used here must also appear in `tenants` — the chart refuses to
  # render otherwise, because an unmounted kit would silently fall back to
  # Nudgebee branding on a partner's own domain.
  # @default -- `{}`
  hostMap: {}
  #   demo.partner.example.com: acme
  # -- Optional deployment-wide brand for hosts with no `hostMap` entry. Leave
  # empty to keep unmapped hosts on Nudgebee branding. Setting this alone (no
  # `hostMap`) is the single-tenant setup: every host gets this brand.
  defaultTenant: ''

annotations: {}

# -- Webhook paths the nginx sidecar proxies to sibling services. Turn a route
# off when its chart is installed with `enabled: false` — nginx resolves
# proxy_pass hostnames at startup, so a route to an absent Service crashes the
# sidecar and the app with it.
webhookRouting:
  # -- Route /webhooks/slack/* to the notifications chart. Pair with `notifications.enabled`.
  notifications: true
  # -- Route /api/webhooks/* to the services-server chart.
  servicesServer: true

nginx:
  image:
    # Override registry for enterprise via values-enterprise.yaml (e.g.
    # `registry: registry.nudgebee.com`). Community default is GHCR.
    registry: 'ghcr.io/nudgebee'
    repository: nginx
    tag: stable-alpine3.20-slim-nb1
    pullPolicy: IfNotPresent
  resources: {}
