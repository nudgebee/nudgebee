{{- if .Values.branding.enabled }}
{{- range $host, $slug := .Values.branding.hostMap }}
{{- $known := false }}
{{- range $.Values.branding.tenants }}{{- if eq .slug $slug }}{{- $known = true }}{{- end }}{{- end }}
{{- if not $known }}
{{- fail (printf "branding.hostMap[%s] selects tenant %q, which has no entry in branding.tenants — its kit would not be mounted and the host would silently render Nudgebee branding." $host $slug) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (( default .Values.global.imagePullSecrets .Values.imagePullSecrets )) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: nextjs-static-init
          image: {{ include "imageName" . }}
          command: ["sh", "-c", "cp -r /app/.next /nextjs-static && cp -r /app/public /nextjs-static"]  #Copy both the `.next` and `public` directories
          volumeMounts:
            - name: nextjs-static
              mountPath: /nextjs-static        
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "imageName" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "nudgebee.secretName" . | quote }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "app.fullname" . }}-extra-env
            {{- end }}
          {{- if or .Values.statusNotice.configMapName (and .Values.branding.enabled (or .Values.branding.defaultTenant .Values.branding.hostMap)) }}
          env:
            {{- if .Values.statusNotice.configMapName }}
            - name: STATUS_NOTICE_FILE
              value: /etc/nudgebee/status/notice.json
            {{- end }}
            {{- if .Values.branding.enabled }}
            {{- if .Values.branding.defaultTenant }}
            # Read by loadBrandingFile() relative to process.cwd()/public, i.e.
            # /app/public/branding/<tenant>/theme.json — the mount below. Applies
            # to every host with no branding.hostMap entry.
            - name: TENANT_BRANDING_FILE
              value: branding/{{ .Values.branding.defaultTenant }}/theme.json
            {{- end }}
            {{- if .Values.branding.hostMap }}
            # Per-host brand selection: request hostname -> tenant slug. Read by
            # ee/branding/serverInit.ts, which resolves the theme file for the
            # request's X-Forwarded-Host on every render and API call.
            - name: TENANT_BRANDING_HOST_MAP
              value: {{ toJson .Values.branding.hostMap | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.serverPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nextjs-static
              mountPath: /nextjs-static
            {{- if .Values.statusNotice.configMapName }}
            # Directory mount, deliberately NOT subPath: subPath mounts do not
            # receive ConfigMap updates, which would force a pod restart to
            # publish an incident notice.
            - name: status-notice
              mountPath: /etc/nudgebee/status
              readOnly: true
            {{- end }}
            {{- if .Values.branding.enabled }}
            # One mount per brand kit — a deployment fronting several partner
            # hostnames carries all of their kits at once.
            #
            # Directory mounts, deliberately NOT subPath: subPath mounts do not
            # receive ConfigMap updates, so editing a theme would need a pod
            # restart. Nothing is shadowed — the image ships no
            # public/branding/<tenant>/ directory for a white-label tenant.
            #
            # Only the app container. nginx serves `/public/` from its own copy
            # of the static tree; `/branding/<tenant>/…` does not match that
            # location and is proxied to Next.js in this container.
            {{- range .Values.branding.tenants }}
            - name: tenant-branding-{{ .slug }}
              mountPath: /app/public/branding/{{ .slug }}
              readOnly: true
            {{- end }}
            {{- end }}
        - name: nginx  # Nginx sidecar container
          image: {{ .Values.nginx.image.registry }}/{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: web
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nextjs-static
              mountPath: /app
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true              
          resources: {{- toYaml .Values.nginx.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nextjs-static
          emptyDir: {}
        {{- if .Values.statusNotice.configMapName }}
        # `optional` so the pod still starts when no notice ConfigMap exists —
        # the normal state. No notice simply means no banner.
        - name: status-notice
          configMap:
            name: {{ .Values.statusNotice.configMapName | quote }}
            optional: true
        {{- end }}
        {{- if .Values.branding.enabled }}
        # NOT optional: a missing brand kit would silently start the pod with
        # Nudgebee branding on a white-label deployment. Fail to schedule instead.
        {{- range .Values.branding.tenants }}
        - name: tenant-branding-{{ .slug }}
          configMap:
            name: {{ .configMapName | quote }}
        {{- end }}
        {{- end }}
        - name: nginx-config
          configMap:
            name: {{ include "app.fullname" $ }}-nginx-config        
