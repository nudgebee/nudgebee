# Default values for cloud-collector-server-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nudgebee-cloud-collector-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 'latest'

global:
  image:
    registry: 'ghcr.io/nudgebee'
  imagePullSecrets: []
  initImages:
    postgres: 'ghcr.io/nudgebee/postgres:16.15-alpine-nb1'
    curl: 'ghcr.io/nudgebee/curl:8.23.0'
  # `helm test` connection pod (templates/tests/test-connection.yaml). Full ref,
  # like initImages above: a third-party image a private-registry install has to
  # mirror under whatever name that registry uses.
  testImage: 'ghcr.io/nudgebee/busybox:1.37.0'
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

# AWS credentials from this pod's Kubernetes service-account token (web identity), instead of
# node credentials or a static access key. Works on any cluster whose service-account issuer
# is registered as an IAM OIDC provider in AWS (EKS, GKE, ...).
#
# roleArn must be the identity that connected AWS accounts trust: the role configured as
# NUDGEBEE_INSTANCE_ROLE, which the CloudFormation/Terraform onboarding writes into each
# account's trust policy. Pointing it at a different role breaks AssumeRole for every
# existing account until each account's trust names the new role.
#
# Rollout:
#   1. Register the cluster's service-account issuer as an IAM OIDC provider in the account
#      that owns NUDGEBEE_INSTANCE_ROLE.
#   2. Add a web-identity trust statement to that role: Federated = the provider,
#      `aud` = `audience`, `sub` = system:serviceaccount:<namespace>:<this service account>.
#   3. If that role is also the nodes' instance role, give the nodes their own role. Otherwise
#      every pod on those nodes can still obtain it through instance metadata.
#
# If NUDGEBEE_INSTANCE_ROLE is not a role (for example an IAM user), create a role, set
# NUDGEBEE_INSTANCE_ROLE to it, and update each connected account's trust before enabling this.
awsWebIdentity:
  enabled: false
  roleArn: ''
  audience: sts.amazonaws.com
  expirationSeconds: 3600
  mountPath: /var/run/secrets/aws/web-identity
  # Pod fsGroup applied when podSecurityContext sets none. The token file is group-readable by
  # this group and not world-readable.
  fsGroup: 1001

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  # -- Enable [ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
  enabled: false
  # -- Ingress [class name](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class).
  className: 'nginx'
  # -- Annotations to be added to the ingress.
  annotations: {}
  # -- Ingress host configuration.
  # @default -- See [values.yaml](values.yaml).
  hosts: [] # -- Ingress TLS configuration.
  # @default -- See [values.yaml](values.yaml).
  tls: []

secretName: 'nudgebee'

# Small-tier defaults. See docs/sizing-and-tiers.md.
# Memory is modest and flat on our own deployments — 26-273Mi average, 895Mi peak
# — so the old 2Gi request reserved roughly 8x what the pod uses. The request
# comes down to 500Mi — no lower: a re-measure put small installs at 271-302Mi
# average, so the 250Mi this started at was already below the average it has to
# cover. The 3Gi limit does NOT come down. A customer install was found with this limit
# manually raised to 5Gi, which is direct evidence that our measurements do not
# capture the worst case for this service: account count, account size and API
# throttling all vary far more in the field than across our estate. Large tier
# goes to 6Gi for the same reason.
# CPU is the opposite: this is the one genuinely CPU-hungry service, measured at
# 373m average with a 2.6-core peak while sweeping 433 cloud accounts. Deliberately
# NO CPU limit — the work is bursty discovery and throttling it just stretches the
# sync window. The request below is the Small-estate p95; raise it with the tier.
resources:
  requests:
    cpu: 100m
    memory: 500Mi
  limits:
    memory: 3Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

annotations: {}
