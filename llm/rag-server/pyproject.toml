[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]


[project]
name = "RAGServer"
version = "0.1.0"
description = ""
authors = [{ name = "Nudgebee", email = "dev@nudgebee.com" }]
requires-python = ">=3.10,<=3.14"
dependencies = [
    # --- Core framework ---
    "aiofiles==25.1.0",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.44.0",
    "python-multipart==0.0.31",
    "python-dotenv==1.2.2",
    "asgiref==3.11.1",

    # --- Observability ---
    "opentelemetry-distro==0.63b1",
    "opentelemetry-exporter-otlp==1.42.1",
    "python-json-logger==4.0.0",

    # --- Vector database ---
    "qdrant-client==1.16.0",

    # --- Database & storage ---
    "psycopg2-binary==2.9.10",
    "boto3==1.42.74",
    "botocore==1.42.74",
    "s3transfer==0.16.0",
    "sqlalchemy==2.0.49",
    "pymongo==4.11.3",

    # --- AI/LLM SDKs (direct, no langchain) ---
    "openai==2.26.0",
    "anthropic==0.84.0",
    "azure-ai-inference>=1.0.0b9",
    "google-genai==1.66.0",

    # --- On-device embeddings ---
    # transformers >=5.5.0 clears CVE-2026-4372 / CVE-2026-5241 (RCE via malicious
    # model load) and CVE-2026-1839. The old `sentence-transformers[onnx]` extra
    # capped transformers at <4.58 through optimum-onnx — which is unused here: the
    # ONNX embedding backend in rag/core/embeddings/local.py calls onnxruntime
    # directly, never optimum. So drop the extra, pin onnxruntime explicitly (keeps
    # that backend working), and force transformers 5.x. transformers 5.x in turn
    # requires huggingface-hub >=1.5 (we use only the stable hf_hub_download API).
    "sentence-transformers>=5.6.0",
    "transformers>=5.5.0",
    "onnxruntime>=1.23.2",
    "huggingface-hub>=1.5.0",
    "hf_xet==1.3.2",
    "numpy>=1.26.0",

    # --- Document processing ---
    "tiktoken==0.12.0",
    "beautifulsoup4==4.14.3",
    "unstructured==0.18.32",
    "pymupdf==1.27.2.2",
    "jq==1.10.0",

    # --- Security-forced transitive bumps (CVE fixes; none imported directly) ---
    # Pulled transitively (msal->PyJWT, rsa->pyasn1, sentence-transformers->onnx/
    # transformers, unstructured->pypdf, fastapi->starlette). Pinned here to force
    # the patched versions. setuptools<81 guards the ml-base pkg_resources crash.
    "PyJWT>=2.13.0",
    "pyasn1>=0.6.3",
    "onnx>=1.22.0",
    "pypdf>=6.13.3",
    "starlette>=1.3.1",
    "setuptools<81",

    # --- External integrations ---
    "atlassian-python-api==4.0.7",
    "pysnow==0.7.17",
    "kubernetes==32.0.1",

    # --- Utilities ---
    "filelock==3.29.0",
    "httpcore==1.0.9",
    "psutil==7.2.2",
    "pydantic>=2.11.2",
    "pydantic-settings>=2.10.1",
    "orjson==3.11.8",
    "validators==0.34.0",
    "cryptography==48.0.1",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.1",
    "click==8.2.1",
    "durationpy==0.10",
    "frozenlist==1.5.0",
    "fsspec==2026.4.0",
    "httpx-sse==0.4.1",
    "monotonic==1.6",
    "msal==1.34.0",
    "multidict==6.7.1",
    "mypy-extensions==1.1.0",
    "propcache==0.3.1",
    "pydantic-core==2.33.1",
    "pygments==2.20.0",
    "rsa==4.9",
    "simsimd==6.2.1",
    "soupsieve==2.8.4",
    "sympy==1.13.3",
    "typer==0.24.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "watchfiles==1.1.1",
    "yarl==1.19.0",
    "zipp==3.21.0",

    # --- Type stubs ---
    "types-aiofiles==25.1.0.20251011",
    "types-requests==2.32.4.20250913",
    "types-botocore==1.0.2",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-psutil==7.2.2.20260130",
    "types-awscrt==0.31.3",
    "types-html5lib==1.1.11.20260402",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.0",
    "black==26.3.1",
    "mypy==1.16.1",
    "flake8==6.1.0"
]
test = [
    "pytest==9.0.3",
    "pytest-benchmark==5.1.0"
]

[tool.mypy]
namespace_packages = true
exclude = ['venv', '.venv']

[tool.black]
line-length = 120
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.ml-env
  | _build
  | buck-out
  | build
  | dist
  | notebooks
)/
'''
