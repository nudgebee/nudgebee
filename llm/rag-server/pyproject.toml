[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]


[project]
name = "RAGServer"
version = "0.1.0"
description = ""
authors = [{ name = "Nudgebee", email = "dev@nudgebee.com" }]
requires-python = ">=3.11,<=3.13"
dependencies = [
    # --- Core framework ---
    "aiofiles==25.1.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "python-dotenv==1.2.2",

    # --- Observability ---
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-requests==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "python-json-logger==4.1.0",

    # --- Vector database ---
    "qdrant-client==1.19.0",
    "redis==5.2.1",

    # --- Database & storage ---
    "psycopg2-binary==2.9.12",
    "boto3==1.43.72",
    "botocore==1.43.72",
    "sqlalchemy==2.0.52",

    # --- AI/LLM SDKs (direct, no langchain) ---
    "openai==2.53.0",
    "anthropic==0.122.0",
    "azure-ai-inference>=1.0.0b9",
    "google-genai==1.66.0",

    # --- On-device embeddings ---
    # transformers >=5.5.0 clears CVE-2026-4372 / CVE-2026-5241 (RCE via malicious
    # model load) and CVE-2026-1839. The old `sentence-transformers[onnx]` extra
    # capped transformers at <4.58 through optimum-onnx — which is unused here: the
    # ONNX embedding backend in rag/core/embeddings/local.py calls onnxruntime
    # directly, never optimum. So drop the extra, pin onnxruntime explicitly (keeps
    # that backend working), and force transformers 5.x. transformers 5.x in turn
    # requires huggingface-hub >=1.5 (we use only the stable hf_hub_download API).
    "sentence-transformers>=5.6.0",
    "transformers>=5.5.0",
    "onnxruntime>=1.23.2",
    "huggingface-hub>=1.5.0",
    "numpy>=1.26.0",

    # --- Document processing ---
    "tiktoken==0.13.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "markdownify==1.2.0",
    "pymupdf==1.28.2",
    "jq==1.12.0",

    # --- Security-forced transitive bumps (CVE fixes; none imported directly) ---
    # Pulled transitively (msal->PyJWT, rsa->pyasn1, sentence-transformers->onnx/
    # transformers, unstructured->pypdf, fastapi->starlette). Pinned here to force
    # the patched versions. setuptools>=83 clears CVE-2026-59890 (old <81 cap no longer needed).
    "PyJWT>=2.15.0",
    "pyasn1>=0.6.3",
    "onnx>=1.22.0",
    "pypdf>=6.21.2",
    "starlette>=1.3.1",
    "setuptools>=83",

    # --- External integrations ---
    "atlassian-python-api==4.0.7",
    "pysnow==0.7.17",

    # --- Utilities ---
    "filelock==4.2.4",
    "httpx==0.28.1",
    "requests==2.34.2",
    "urllib3==2.8.0",
    "psutil==7.2.2",
    "pydantic>=2.11.2",
    "cryptography==50.0.1",

    # --- Type stubs ---
    "types-aiofiles==25.1.0.20260518",
    "types-requests==2.33.0.20260712",
    "types-botocore==1.0.2",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-psutil==7.2.2.20260130",
    "types-awscrt==0.36.2",
    "types-html5lib==1.1.11.20260402",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.2",
    "black==26.10.1",
    # mypy 1.16.1 crashes (INTERNAL ERROR, RuntimeError: Not implemented
    # TypeGuardedType) while resolving indirect dependencies of the openai and
    # anthropic SDKs at the versions pinned above. Fixed from 1.17 onward.
    "mypy==1.20.2",
    "flake8==6.1.0"
]
test = [
    "pytest==9.1.1",
    "pytest-benchmark==5.2.3"
]

[tool.uv]
# pysnow (ServiceNow KB scraper, basic auth only) caps oauthlib<4 but never touches
# OAuth; oauthlib 4 clears the Scorecard oauthlib advisories.
