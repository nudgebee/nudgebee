[project]
name = "benchmark"
version = "0.1.0"
description = "Benchmarking server for LLM and RAG systems"
authors = [
    { name = "Nudgebee", email = "dev@nudgebee.com" },
    { name = "Contributors" },
]
readme = "README.md"
requires-python = "==3.13.*"
# Direct dependencies only — packages imported by benchmark_server/, app.py,
# tbench/, llm/ (agent suites; fixture sample-apps excluded), plus the CI
# toolchain (black, flake8, pytest) and runtime-only requirements (uvicorn,
# psycopg2 driver, python-multipart for fastapi Form). Transitive versions are
# pinned by uv.lock (native `uv lock` format), which dependabot regenerates
# together with these pins.
dependencies = [
    # Prerelease floors: langchain-azure-ai only resolves against beta
    # releases of these two, so they must be requested explicitly.
    "azure-ai-inference==1.0.0b9",
    "azure-cosmos==4.16.0b2",
    "black==26.5.1",
    "boto3==1.43.6",
    "botocore==1.43.6",
    "cryptography==46.0.7",
    "datasets==4.0.0",
    "fastapi==0.141.1",
    "flake8==6.1.0",
    "httpx==0.28.1",
    "langchain-aws==1.4.6",
    "langchain-azure-ai==1.2.3",
    # langchain-community must stay in lockstep with ragas: 0.4.1 is the last
    # version with chat_models.vertexai, which the ragas 0.4.3 controller
    # import path needs (see Dockerfile comment / past incident).
    "langchain-community==0.4.1",
    "langchain-core==1.3.3",
    "langchain-google-genai==4.2.2",
    "langchain-google-vertexai==3.2.3",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.2.1",
    "nest-asyncio==1.6.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "python-json-logger==3.3.0",
    "python-multipart==0.0.28",
    "pyyaml==6.0.3",
    "ragas==0.4.3",
    "requests==2.33.1",
    "sqlalchemy==2.0.51",
    "starlette==0.49.1",
    "terminal-bench==0.2.18",
    "urllib3==2.7.0",
    "uvicorn==0.52.1",
]

[tool.setuptools.packages.find]
include = ["llm*", "server*"]
