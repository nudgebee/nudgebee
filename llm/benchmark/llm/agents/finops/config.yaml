# FinOps agent benchmark configuration
#
# The FinOps agent is a ReAct supervisor (auto-upgrades to ReAct3) that
# orchestrates cloud cost analysis. Its final answer is synthesized prose,
# not a tool output, so tool_names is empty (we score the response text via
# RAGAS, not a single tool's payload).
#
# Write safety: the orchestrator answers tool-confirmation followups with an
# explicit "no" (auto_deny_write_confirmations, default true), so a benchmark
# can never approve a mutation and write fixtures score the denial handling.
# A fixture exercising a real apply flow sets
# auto_deny_write_confirmations: false in its test_case.yaml.
agent: finops
tool_names: []
max_retries: 2
auto_deny_write_confirmations: true
