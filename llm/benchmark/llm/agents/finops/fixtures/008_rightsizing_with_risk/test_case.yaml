user_prompt: "Find the workload with the largest pod rightsizing saving on this account and tell me whether it is safe to apply."
expected_output:
  - |
    The agent should find the pod rightsizing recommendation with the
    largest positive estimated saving from the recommendations data (not
    invent a workload), name that workload and namespace from the data, and
    quote the estimated monthly saving in dollars with the recommendation
    id. It should then assess whether applying is safe using evidence, not
    vibes: the recommendation's safety data (safety_band with its reason,
    dependent_count / production_dependents — when the band is NULL it must
    say impact analysis has not run rather than inventing a rating) and,
    where it strengthens the answer, observed utilization (p50/p95) or
    HPA/autoscaling status for that workload. The answer ends with a risk
    rating tied to that evidence and a concrete next step matched to the
    band (apply via the platform flow, or review first). Cite the source
    tools for the claims.
tags:
  - rightsizing
  - drilldown
  - kubernetes
  - hard
  - finops
