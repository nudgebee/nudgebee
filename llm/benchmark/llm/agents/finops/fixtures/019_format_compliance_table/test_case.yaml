user_prompt: "Give me a quick spend summary."
expected_output:
  - |
    The response must follow the agent's spend-breakdown output contract:
    lead with one headline sentence stating total monthly
    spend in dollars and percentage change vs the prior period, then a
    table carrying the spend-breakdown columns: Resource/Service, Current ($),
    Previous ($), Change (%), Signal, Savings Available ($), with trend
    indicators (stable) for <5% change, NEW for absent prior period, GONE for
    terminated. Close with available savings from
    recommendations and a suggested drill-down area. Every dollar figure
    must cite [spend_summary] or the recommendations data source ([recommendations] or [recommendation_execute]). The lead must NOT
    describe the methodology (e.g. "I queried spend_summary and found...")
    — it must be the headline result.
tags:
  - format
  - overview
  - easy
  - finops
