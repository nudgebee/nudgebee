user_prompt: "Pick the database with the largest downsizing saving on this account — should I downsize it?"
expected_output:
  - |
    The agent should find the largest database rightsizing/downsizing
    recommendation from the recommendations data and name the actual
    instance. Because downsizing a database requires a restart and may
    serve shared production traffic, the answer must weigh risk with
    evidence: the recommendation's safety band and blast radius
    (production_dependents / dependent_count — when NULL, say impact
    analysis has not run and treat the change as unverified rather than
    safe), plus utilization (p50/p95 burstiness) where available. The
    response should quote the potential savings in dollars but recommend
    careful planning (off-peak window, snapshot, rollback plan) — or a
    zero-restart alternative such as a commitment purchase when the
    utilization data does not support downsizing — rather than an
    unqualified yes. Cite the source tools for the utilization and
    savings claims.
tags:
  - rightsizing
  - risk
  - database
  - hard
  - finops
