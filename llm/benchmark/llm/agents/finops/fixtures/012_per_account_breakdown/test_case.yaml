user_prompt: "Show me cost breakdown by cloud account."
expected_output:
  - |
    spend_summary is scoped to the conversation's cloud account (multiple
    cloud_accounts can ingest the same billing source, so cross-account
    aggregation would double-count). The agent should call spend_summary
    with group_by=cloud_account, present the current account's spend in
    dollars with previous-period comparison and percentage change plus any
    estimated savings, and say clearly that the figures cover this account
    — offering a per-service or per-namespace breakdown (group_by=service /
    spend_allocation) as the drill-down. It must not fabricate rows for
    other accounts. Cite [spend_summary].
tags:
  - spend
  - account
  - easy
  - finops
