# No-matching-runbook scenario, scoped to Nubi. The Nubi runner does not
# consume the runbook-catalog field that some upstream harnesses use to inject
# a fake catalog for force-fit checks, so the runbook framing isn't exercised
# here.
#
# The underlying scenario is still useful on its own: a WhaleWatcher CRD
# operator with an incomplete ClusterRole (missing update/patch on the CRD
# status). The agent must investigate and identify the RBAC permission denial.

user_prompt: "The custom CRD whale-watcher resources are not being reconciled by the operator in namespace app-96. Investigate why."

expected_output:
  - The agent must identify that the whale-operator ServiceAccount or ClusterRole lacks the necessary RBAC permissions.
  - Specifically, the whale-operator role is missing update and/or patch verbs on whalewatchers.ocean.io (or the /status subresource).
  - The answer should reference the operator's reconciliation failure due to permission denial (forbidden, not authorized, or RBAC denial).

tags:
  - kubernetes
  - rbac
  - medium
  - holmesgpt-parity

before_test: |
  set -e
  kubectl create namespace app-96 || true
  kubectl label namespace app-96 benchmark=true --overwrite || true
  kubectl apply -f manifest.yaml
  # manifest.yaml defines the CRD; applying an instance of it before the API
  # server has established the CRD fails with "no matches for kind
  # WhaleWatcher" (reproducible even with full permissions, since kubectl
  # applies the file's docs before the CRD is discoverable). Wait for
  # Established, then apply the WhaleWatcher instances from manifest-cr.yaml.
  kubectl wait --for=condition=Established crd/whalewatchers.ocean.io --timeout=30s
  kubectl apply -f manifest-cr.yaml
  # The operator prints its RBAC-forbidden log line on its first reconcile
  # loop iteration, immediately on startup (before its own 30s interval
  # sleep) — so waiting for the deployment to roll out is enough to
  # guarantee that line exists, without a blind fixed sleep.
  kubectl rollout status deployment/whale-operator -n app-96 --timeout=60s

after_test: |
  # || true on the CR delete: if before_test failed before the CRD
  # established, "WhaleWatcher" isn't a registered kind yet and
  # --ignore-not-found doesn't cover that (it only skips missing instances
  # of a known kind, not an unknown kind) — kubectl delete would error.
  kubectl delete -f manifest-cr.yaml --ignore-not-found || true
  kubectl delete -f manifest.yaml --ignore-not-found
  kubectl delete namespace app-96 --force --grace-period=0 --ignore-not-found
