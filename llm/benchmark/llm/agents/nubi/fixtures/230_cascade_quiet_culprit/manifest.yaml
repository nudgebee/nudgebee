---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: namespace-230
  labels: {app: api-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
      - name: api-gateway
        image: python:3.11-slim
        command: ["python"]
        args: ["/scripts/generate_logs.py"]
        env:
        - {name: ROLE, value: "dependent"}
        - {name: SERVICE_NAME, value: "api-gateway"}
        volumeMounts:
        - {name: script-volume, mountPath: /scripts}
        resources:
          requests: {memory: "48Mi", cpu: "10m"}
          limits: {memory: "128Mi", cpu: "100m"}
      volumes:
      - name: script-volume
        secret: {secretName: cascade-logs-script-230, defaultMode: 0755}
