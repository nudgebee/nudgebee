user_prompt: "Were there issues with the cron-scheduler pod in namespace-73b?"
tags:
  - logs
  - context_window
  - datetime
  - medium
  - holmesgpt-parity
expected_output:
  - Cron scheduler pod experienced issues between 03:00-03:05 when it could not connect to an external API possibly due to a maintenance window
  - Answer MUST include the time window of the issue (03:00-03:05)
before_test: |
  # Create namespace first since the secret depends on it (|| true ignores if it already exists)
  kubectl create namespace namespace-73b || true
  kubectl label namespace namespace-73b benchmark=true --overwrite || true
  kubectl create secret generic cron-scheduler-logs-script --from-file=generate_logs.py=./generate_logs.py -n namespace-73b --dry-run=client -o yaml | kubectl apply -f -
  kubectl apply -f ./manifest.yaml
  # Wait for the pod's generate_logs.py to backfill 24h of virtual time.
  # On a resource-constrained pod (10m CPU / 64Mi memory) the backfill needs
  # ~60-90s to iterate through 8640 steps under normal load; 50s was cutting
  # it close and caused the log fetch to race with the 03:00 UTC failure
  # iteration. 120s itself proved insufficient on a busy shared cluster:
  # confirmed live (benchmark run dd7bc6b21b45's rerun) that an agent's log
  # fetch several real minutes after this wait had only captured ~354 of the
  # eventual ~8640 lines — the backfill pod was still starved of CPU. Raised
  # to 240s for headroom; there is no completion signal in the pod's own
  # output to poll on instead (see generate_logs.py — it just idles after
  # the loop, no "done" marker), so this remains a fixed wait, not a poll.
  sleep 240
after_test: |
  kubectl delete -f ./manifest.yaml
  kubectl delete secret cron-scheduler-logs-script -n namespace-73b --ignore-not-found
  kubectl delete namespace namespace-73b --ignore-not-found
