apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-generator
  namespace: app-010
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-generator
  template:
    metadata:
      labels:
        app: event-generator
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Event generator running'; sleep 3600"]
