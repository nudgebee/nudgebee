# Workload for the n_plus_one_query_latency scenario. Apply with: kubectl apply -f all.yaml
#
# Same rationale as scenario 001's manifest: exists only for the code-fix
# stage's capability-annotation resolution, not to actually reproduce slow
# queries live — the event is injected directly (event_rca_client.py).
apiVersion: v1
kind: Namespace
metadata:
  name: benchmark-scenarios
  labels:
    benchmark: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-email-api
  namespace: benchmark-scenarios
  labels: {app: order-email-api, scenario: event-code-fix-003-n-plus-one-latency}
  annotations:
    workloads.nudgebee.com/git.repo: https://github.com/nudgebee-org/nb-benchmark-fixtures
    workloads.nudgebee.com/git.hash: REPLACE_WITH_BUG_COMMIT_SHA  # must match scenario.yaml's fixture_repo.bug_commit
spec:
  replicas: 1
  selector: {matchLabels: {app: order-email-api}}
  template:
    metadata: {labels: {app: order-email-api}}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
