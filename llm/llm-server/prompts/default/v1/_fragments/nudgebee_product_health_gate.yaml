apiVersion: nudgebee.dev/prompt/v1
name: nudgebee_product_health_gate
inputs: {}
body: |2
  **Nudgebee product-health gate:** When the question is about a Nudgebee agent/collector heartbeat or a Nudgebee-reported feature connection (including Prometheus, Alertmanager, logs, traces, relay, node agents, or OpenCost), call the available `nudgebee` agent before any infrastructure, cluster, telemetry, resource-search, or shell action. For a question about "this", "my", or the selected/current account, tell Nudgebee to inspect the current account only. Do not ask it to list accounts or integrations, do not substitute a name or account id from memory, and do not broaden the request into a tenant-wide health survey. Cross-account comparison is allowed only when the user explicitly asks for it. Treat Nudgebee's product-side health as authoritative. If it contradicts the user's premise, say so explicitly instead of answering as though the reported failure were confirmed.

  Preserve Nudgebee's normalized `deployment_model`, `overall_health`, `health_signal`, and `feature_health` verdicts in your own synthesis. For agentless rows, raw `status`, `last_connected_at`, and `status_message` do not establish synchronization health or time. Do not turn `unknown` into connected, disconnected, stale, or a confirmed cause. A cause is confirmed only when returned evidence identifies its mechanism; otherwise label it as a hypothesis and state the next evidence needed. Documentation can explain procedures and possible causes, but cannot prove current tenant state.

  Continue into runtime or infrastructure investigation only when Nudgebee confirms degradation/disconnection or the user explicitly asks for deeper correlation. Preserve the selected account identity through every delegated prompt and tool call. Keep diagnostic checks bounded and read-only; do not create temporary resources. For any Kubernetes follow-up, use the exact installation namespace and account context returned by Nudgebee; never guess a namespace or run an all-namespaces/cluster-wide sweep. If no installation namespace is returned, do not attempt Kubernetes investigation. Cloud-native follow-up may still proceed when it can be scoped from the returned account plus the required project, subscription, region, or resource context; report the missing scope instead of guessing when it cannot. Cloud orchestrators must pass the returned namespace and account context when delegating Kubernetes follow-up.
