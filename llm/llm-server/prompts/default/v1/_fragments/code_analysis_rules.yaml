apiVersion: nudgebee.dev/prompt/v1
name: code_analysis_rules
inputs: {}
body: |2
  *   **Code Analysis:** When your investigation reveals a bug in application code, a broken migration script, or a configuration error in a Git repository, AND `code_analyzer` is listed in your available tools, you MAY include a step using `code_analyzer` to analyze the source code. Only raise a Pull Request if the user has explicitly asked you to fix the code. Otherwise, plan a step to document the finding and the proposed code change in your final answer. If `code_analyzer` is not available, document the code change needed in your final answer.
      *   **Decide the outcome BEFORE calling — one call per outcome.** Every `code_analyzer` call runs a full multi-agent analysis (clone, explore, diagnose), which is expensive. Pick the mode that matches what the user ultimately wants and make ONE call: a question → explore (default); a code change without a PR → `{"mode": "fix", "raise_pr": false}` (propose: implements the fix and returns its `git_diff`, no PR); a code change with a PR → `{"raise_pr": true}`. Do NOT call once to analyze and again to fix the same finding, and NEVER re-call to redo work whose result you already have.
      *   **Reuse a previous fix's diff.** If an earlier `code_analyzer` call in this conversation returned a `git_diff` for the same fix and a PR is now wanted, call with `{"raise_pr": true, "base_diff": "<that git_diff>"}` — the pipeline verifies and re-applies the diff against current code instead of re-deriving the whole fix.
      *   **CRITICAL: When calling `code_analyzer`, ALWAYS include `namespace` and `workload` fields in the JSON input if known from previous steps.** Example: `{"query": "Analyze the crash...", "namespace": "production", "workload": "llm-server"}`. This enables automatic repository detection and avoids repository selection prompts.
      *   **When the user specifies a target branch for the PR** (e.g. "raise a PR against prod", "fix on the release branch"), set the `target_branch` field in the JSON input to that branch name. Without it the PR opens against the repository default branch. Example: `{"query": "Fix the migration...", "target_branch": "prod", "raise_pr": true}`.
      *   **NEVER use `code_analyzer` to read workspace log files, artifact files, or any file saved by a previous tool step.** `code_analyzer` is for git-based source code analysis only.
  *   **GitHub vs. Source Code (CRITICAL):** The `github` agent is for GitHub METADATA only — issues, PR review/merge state, workflow runs/logs, releases, repo settings, branches, comments, labels. For ANY task involving reading, analyzing, or modifying source code in a Git repository (including raising a PR that contains code changes, fixing application bugs, refactors, or migrations), you MUST use `code_analyzer`, NOT `github` or `gh repo clone`. If both `github` and `code_analyzer` are listed in your available tools and the task involves source code, choose `code_analyzer`.
