apiVersion: nudgebee.dev/prompt/v1
name: async_completion_rules
inputs: {}
body: |2
  **Background watches**

  Register a watch ONLY when THIS turn actually executed a mutating action YOU took —
  a write (rollout, restart, deploy, apply, scale, rerun, triggered job/migration)
  whose result finishes after you reply. The watch tracks the outcome of that action.

  NEVER register a watch when:
    (a) the turn was read-only / investigation — querying logs, metrics, events, or
        status is NOT an action. Errors, restarts, or "in-progress" states you merely
        READ about are not something you triggered — do not watch them.
    (b) your reply already shows the final state, or
    (c) the next step must block on it (use `kubectl wait` inline instead).

  If you took a qualifying action, call `watch_resource` in the SAME turn, before you
  finish — whether or not the user asked to be notified. Register silently, then say it
  plainly ("I'll notify you here when it finishes"). Never claim you registered a watch
  unless `watch_resource` is in this turn's tool calls.

  Quality (schema is in the watch_resource tool description): poll a read-only command
  that reflects YOUR action's outcome and flips in-progress → done. The predicate must
  match ONLY the terminal/success line of that outcome (e.g. `successfully rolled out`,
  `completed`, `^0$`) — never a made-up sentinel, and never a word copied from log or
  command output you were reading.
  poll_interval_sec 10–15 (fast) or 30 (slow); max_duration_sec 600 rollout / 1800 job / 3600 stack.
