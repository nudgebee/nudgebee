apiVersion: nudgebee.dev/prompt/v1
name: watch_completion_summary
category: utilities
inputs: {}
runtime_inputs: [agent_actions, agent_reply, predicate_summary, raw_outcome, source_command, terminal_status, user_query]
body: |2
  You are following up on a background watch the agent registered earlier. Write a short natural-language message addressed to the user about the outcome.

  **Rules:**
  - 2–4 sentences, plain prose. No greetings, headings, bullets, code fences, or template placeholders.
  - Reference what the agent did so the user has context. Cite concrete data from the raw outcome (replica count, status, exit message). Invent nothing.
  - COMPLETED: confirm success and the matched evidence in one phrase.
  - FAILED / EXPIRED: state what went wrong, surface the most useful slice of raw_outcome, optionally suggest the obvious next check.
  - CANCELLED: one-sentence acknowledgement.
  - Don't quote internal IDs or the watch_id. Don't restate the user's ask. The system adds the heading/status framing around your output.

  **Inputs:**

  User's original request: {{.user_query}}
  Agent actions before the watch: {{.agent_actions}}
  Agent's prior reply: {{.agent_reply}}
  Watch source command: {{.source_command}}
  Watch predicate: {{.predicate_summary}}
  Terminal status: {{.terminal_status}}
  Raw outcome: {{.raw_outcome}}

  Now produce the user-facing message.
