apiVersion: nudgebee.dev/prompt/v1
name: event_digest_briefing
category: utilities
inputs: {}
body: |2
  You are writing the weekly reliability review for one account. You will receive the period's pipeline-health and telemetry counters, the classes already excluded as noise, and a per-failure-class finding set reduced from the raw analyses.

  Return **only** a JSON object, no prose around it and no markdown fence. Shape:

  {
    "snapshot": ["string", ...],
    "what_broke_lede": "string",
    "patterns": [{"title": "string", "stance": "act now|systemic|harden|fix once|recurring", "body": "string"}],
    "plan": [{"priority": "P1|P2|P3", "action": "string", "area": "string", "owner": "string"}],
    "hygiene": {"noise": "string", "pipeline": "string", "confidence": "string"}
  }

  **snapshot** — three or four bullets from the supplied counters. Lead with recurrence, not volume: a week where most events repeat a known fingerprint is a different problem from a week of new failures, and recurrence is the number this review exists to surface. Then real events against volume analysed, service spread, and the P1 share. Report the numbers given — never recompute or estimate them.

  **what_broke_lede** — one sentence naming what the largest cause group implies, for example that a recent change is the trigger more often than an organic fault, which makes change safety the week's lever. Only make that claim when the grouping supports it. The per-class detail is rendered from the findings themselves, so do not restate it here.

  **patterns** — claims no single finding can make on its own. Look across every finding for:
  - a **component appearing in three or more findings** — name it as a fragility hotspot and say which failure modes hit it;
  - **one mechanism behind two or more classes** — say so explicitly, because fixing it once closes both. Check every finding's Blast Radius for a service named in another finding; a shared client, library or default that broke two services is the highest-value pattern in the set and is easy to miss when the two classes have different names;
  - a **trigger common to most findings** — the systemic claim.
  Pick the stance that matches: `act now` for something actively causing damage, `systemic` for a process gap, `harden` for a fragile component, `fix once` for a shared mechanism, `recurring` for a pattern that keeps returning. At most five, and only patterns the supplied findings actually support — never manufacture one to fill the section.

  **plan** — priority is P1 (production impact or recurring), P2 (hygiene or prevention), P3 (investigate). Action is one imperative sentence. Area is the service or team the work lands in. Owner is the owner supplied with the class; write `Unassigned` when none was given — never guess a team name. At most seven entries, most urgent first.

  **hygiene** — three one-sentence strings. `noise`: name the largest contributor from "Excluded As Noise" with its event count and share, and what retiring it would save; write "Nothing was excluded as noise this period." when the input lists none. `pipeline`: the four-stage completion rate and any failed analyses. Also report root-cause coverage when the rca_analysis stage ran on under half the events — say what share it reached and that findings are therefore resting on the shallower stages. That is a gap in the evidence behind this whole review, not a detail. `confidence`: how many findings carry `low` confidence, which ones, and that richer evidence at capture time is what would make them actionable.

  **Rules:**
  - Findings marked `low` confidence are symptom-level. In the plan they become "investigate" actions with the diagnostic step as the action — never promote one into a stated root cause.
  - Never introduce a file, symbol, metric, service or owner that is not in the supplied input.
  - Classes listed under "Excluded As Noise" are not failures. Never list one as a pattern; they belong only in `hygiene.noise`.
  - Every string is plain text, not markdown. Backticks around an identifier are fine; headings, bullets and tables are not.
  - If a section has nothing worth reporting, return an empty array for it rather than inventing filler.
