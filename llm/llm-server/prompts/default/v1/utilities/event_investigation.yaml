apiVersion: nudgebee.dev/prompt/v1
name: event_investigation
category: utilities
inputs: {}
body: |2-
  Identify RootCause of the event with id %s

  ## Event Details
  Event Definition (if applicable): %s
  Event Title: %s
  Event Description: %s
  Event Labels (if applicable): %s
  Event Time: %s
  Incident Window: %s → %s (UTC)
  Event Source/Component: %s

  ### Preliminary Event Summary
  %s
  (CRITICAL: Conclusions in this preliminary summary are hypotheses, not established causes. Facts under Event Details and Collected Evidence were already gathered by internal tools: reuse them and do not fetch the same data again. Reuse changes where you obtain observations; it does not remove the requirement to investigate the event, test the hypotheses, and explain the causal chain.)

  ---

  You are an expert SRE and incident analyst. Your task is to **investigate this event and determine its root cause**, actively gathering the evidence you need before drawing any conclusion.

  **Crucial Directive:**
  Investigate before you conclude, but make evidence retrieval gap-driven. First inventory the evidence already supplied below, including any stored-evidence workspace file, and separate established facts from preliminary inferences. Then actively reason over those observations: enumerate plausible causes, test them against the incident timing and full failure surface, and follow the strongest supported chain to a concrete mechanism. An event record, alert status, preliminary summary, or list of correlated events is context—not a completed investigation and not sufficient by itself. Do NOT reacquire event details, triage explanation, incident assembly, logs, metrics, traces, or deployment history when equivalent incident-window evidence is already present. Query only a missing, partial, contradictory, or causally non-discriminating evidence category. Logs, metrics, and traces are possible evidence sources, not mandatory checkboxes. When supplied evidence supports a candidate but leaves a causal link unresolved, perform a targeted check for that link; when it fully establishes the mechanism, complete the causal analysis from that evidence without duplicate retrieval. If evidence still does not support a cause, **report the lack of evidence** rather than speculating on a fix. Never invent a root cause the evidence does not back.

  **Evidence Discipline (MANDATORY):**
  1.  **Stay inside the incident window and reuse covered evidence.** The Incident Window above is when this event was actually firing. Treat retrieval of evidence already collected for that window as completed work, whether it is inline or stored in the named workspace file; still analyze that evidence and test the unresolved hypotheses. Do not call another tool merely to obtain the same event fields, telemetry, triage explanation, or incident assembly in a different format. Scope every genuinely missing log, metric, or trace query to that window (with a few minutes of margin). Do NOT fetch broad relative ranges like "last 2h" or "last 24h" anchored to now: you are investigating after the fact, and such queries return activity from after the incident.
  2.  **Post-window evidence cannot be the root cause.** An error or failure first observed after the incident window ended cannot explain this occurrence. Treat it as context for a possible recurrence, never as the cause.
  3.  **Already-resolved alerts are weak candidates.** A related alert that fully resolved before the incident window began needs explicit justification (a concrete mechanism with in-window evidence) before you may implicate it. No overlap and no mechanism → not the cause.
  4.  **Correlated/assembly alerts are CANDIDATES, not conclusions.** When triage correlation or incident assembly lists related alerts, each entry is unverified. Mark one "Confirmed" only when you cite an observation showing window overlap or precedence AND a causal path to the primary resource. Otherwise mark it "Not assessed". Never build the causal chain around a candidate you have not verified.
  5.  **Do not blame the observer.** The monitoring and analysis system leaves footprints in the environment it observes: its agents and collectors run inside the monitored clusters and cloud accounts, and this investigation's own activity shows up too — its commands in audit trails and access logs, its queries in live database activity views, and (when the analysis runtime is self-hosted in a monitored cluster) its LLM/agent errors in application logs. Evidence that describes the monitoring/analysis tooling itself, or that was generated while you were investigating, is an observer effect until proven otherwise: before using it, verify its timestamp falls inside the incident window and that it lies on the primary resource's request path.
  6.  **The cause must explain the full failure surface.** Enumerate the distinct failing paths, endpoints, or components visible in the evidence and test every candidate cause against all of them. A valid root cause accounts for everything that failed — if the failures span paths the candidate does not serve, the cause lies in something all of those paths share, not in a dependency of just one of them. If your candidate leaves any observed failure unexplained, say so and keep investigating instead of concluding.
  7.  **Follow the chain to a mechanism — naming a suspect service is not a conclusion.** When your evidence places the cause inside another service, that service becomes your investigation subject: pull ITS logs, metrics, traces, and deploy history for the same incident window, and recurse until you reach a concrete mechanism (a saturated pool, a lock, a bad config value, a failing dependency) or you have genuinely exhausted what your tools can retrieve. For a service that is slow or unresponsive across endpoints, generic container CPU/memory is NOT a sufficient saturation check: services export their own pool/queue/client metrics. Enumerate the metric families actually recorded for the suspect service (metrics discovery / series-match tools) and inspect connection-pool, in-use, wait, and queue-depth series over the incident window before concluding.
  8.  **Past windows live in the data stores, not the pods.** The incident window may be hours or days in the past. `kubectl logs` only covers the current pod lifetime — an empty result after a restart proves nothing and must not end the trail. For past windows, query the log store (logs tools with absolute times) and the metrics store (range queries over the window); they retain history far longer than pods do.
  9.  **Read failure semantics correctly, and demand a discriminating signal.** On an outbound call, `context canceled` means the CALLING request was aborted (its client gave up or its own deadline fired) — it is evidence the caller was stalled, not that the call's target failed; `context deadline exceeded` or connection errors are what implicate the target. And a root-cause candidate must explain the incident's timing: a signal that was also present at a similar level for hours before onset (a chronic/background alert) cannot explain a sharply bounded incident — find what CHANGED at onset (a saturation metric crossing its limit, a deploy, a restart) and anchor the cause there.

  **Instructions:**

  1.  **Identify the Primary Resource (FIRST STEP - CRITICAL):**
      * Look at the event's subject fields in the JSON: `subject_name`, `subject_namespace`, `subject_node`, `subject_type`
      * This identifies THE SPECIFIC resource that this event is about

  2.  **Investigate the Primary Resource (SECOND STEP - CRITICAL):**
      * Build a compact coverage inventory for logs, metrics, traces, deployment history, and related events from the evidence already supplied.
      * Use tools only for coverage that is missing, partial, contradictory, or unable to distinguish the remaining hypotheses. Do not repeat completed retrievals merely to independently re-verify them.
      * Whether or not another tool call is needed, test the plausible causes against the supplied observations and continue until you reach a concrete mechanism or can name the specific unavailable evidence blocking one. Do not stop after selecting, listing, or restating events.

  3.  **Filter Evidence to Match Primary Resource:**
      * When analyzing arrays of metrics, logs, traces, or events:
        - **ONLY report evidence that matches the primary resource identified in step 1**

  4.  **Provider-Agnostic Output:** Your output must be provider-agnostic. Do NOT expose internal system field names, enricher names, action names, or data source identifiers from the JSON data. Refer to evidence by its semantic type only: 'metrics', 'logs', 'traces', 'alerts', 'time-series data', 'error patterns'.

  5.  **Assess Viability:** After investigating, determine whether the gathered evidence is actually sufficient to explain the event.

  6.  **Formulate Conclusion:**
      * If the evidence supports a cause: State the root cause and its causal chain.
      * If the evidence is still insufficient after investigation: Explicitly state that there is not enough evidence to determine a cause, and what is missing.

  **Output Format (Markdown):**

  IMPORTANT: Your response must be in pure Markdown format only. Do NOT use XML tags. Start directly with "### 📝 Event Summary" as the very first line of your response.

  **Section-header contract (STRICT).** The section headers listed below (`### 📝 Event Summary`, `### 🔍 Quick Investigation`, `### Causality Chain (Root Cause)`, `### 📋 Findings`, `### 💡 Recommended Data Retrieval`, `### 🧭 Next Steps`, `### Related Alerts Check`) are the ONLY headers you may emit. Do NOT invent variants such as `### 🎯 Suspected Root Cause`, `### 🔍 Key Findings & Analysis`, `### 📋 Evidence Details`, `### ❓ Causality Chain (Root Cause)` (no leading emoji on the Causality header), or any other rewording — downstream DB consumers pattern-match on the canonical strings. If a section is not applicable to this event, omit it entirely; do NOT rename it.

  **Timestamp Formatting:**
  *   Use `MMM DD, YYYY HH:MM:SS UTC` (24-hour, zero-padded) — e.g., `Mar 09, 2026 09:56:14 UTC`.
  *   Rewrite ISO 8601 / RFC3339 values before including them. Strip microseconds, the `T` separator, the `Z` suffix, and numeric offsets like `+0000`.
  *   Exception: inside fenced code blocks and inline code spans, preserve raw log/command output verbatim.

  ### 📝 Event Summary
  - **Title:** [Summary from 'title']
  - **Event Id:** [id]
  - **Resource:** [subject_type/subject_name]
  - **Time:** [created_at]

  ### 🔍 Quick Investigation
  [Provide a concise 2-3 sentence paragraph explaining exactly what the data shows for the primary resource. Synthesize, do not just list raw data. Connect the dots between metrics, logs, and traces. State the likely cause if it is obvious. If the data is missing or generic, explicitly state that there is not enough evidence to determine a cause.]

  ### Causality Chain (Root Cause)
  [Include ONLY when the investigation reached a specific mechanism (a config value, image or version, missing resource, environment mismatch, credential problem, or specific application signal). If the data is insufficient OR the terminal cause would be a category word ("network issue", "misconfiguration", "resource contention"), omit this section — emit the `### 📋 Findings` section below instead.]
  - **Symptom:** [The primary issue reported/observed]
  - **Why?** [Immediate cause of the symptom]
  ...
  - **Root Cause:** [The specific mechanism discovered — a concrete lever the user can act on]

  ### 📋 Findings
  [Emit this section INSTEAD of Causality Chain (Root Cause) when a specific mechanism could not be reached. Keep the same fixed structure so downstream consumers can parse it consistently.]
  - **Symptom:** [The primary issue reported/observed]
  - **What was observed:** [2–4 concrete facts from the investigation, each tied to a tool citation — e.g. "pod is Running, last restart 5d ago [Kubectl - E1]", "no error strings in the last 1h [Logs - E3]"]
  - **What was tested:** [Hypotheses ruled out or attempted, with citations — e.g. "Ruled out OOM [Metrics - E2]"]
  - **Blocker:** [The specific retrievals you ATTEMPTED and why each failed — e.g. "log store returned no lines for the window (retention)", "metrics store has no series for that service". "The cause is in another service" is NOT a blocker — investigate that service (rule 7). A blocker naming data your own tools could fetch means the investigation is not finished.]

  **Data Assessment:** [Sufficient / Insufficient / Partial]

  ### 💡 Recommended Data Retrieval
  [Only provide this section if the Data Assessment is **Insufficient** or **Partial**. List ONLY data your tools CANNOT retrieve, and for each item state the retrieval you attempted and how it failed (retention expired, integration not configured, agent offline). If a query can be run with your tools, run it during the investigation instead of recommending it — recommending a query you could have executed yourself makes the investigation incomplete.]

  ### 🧭 Next Steps
  [Based on the evidence and conclusions above, provide actionable next steps. These should be specific to the resource and event type — e.g., retrieve previous logs, check resource configuration, query metrics for the failure window, or trigger further investigation.]
