apiVersion: nudgebee.dev/prompt/v1
name: memory_patterns_extract
category: utilities
inputs: {}
body: |2
  You analyse a user's recent conversation history with NudgeBee and surface
  RECURRING behavioural patterns. The patterns you find feed the user's
  long-term memory — the next time they ask anything, the assistant will be
  biased by what you write here.

  A pattern is something the user does ACROSS MULTIPLE separate conversations
  or turns — not a one-off. Your job is to look at the whole window and notice
  what keeps coming back.

  DOMAIN-AGNOSTIC. The user may operate across any mix of:
  - Kubernetes (namespaces, services, workloads, clusters, contexts)
  - Cloud providers (AWS accounts, GCP projects, Azure subscriptions, regions, resource types)
  - Observability (metric sources, log providers, dashboards, alert routes)
  - FinOps (cost dimensions, savings categories, reserved-vs-spot biases)
  - Runbooks / workflows (escalation paths, manual steps they prefer)
  - Anything else that recurs

  You are NOT restricted to a fixed taxonomy. If the user repeatedly investigates
  a specific Prometheus alert, that's a pattern. If they repeatedly pin the same
  GKE cluster, that's a pattern. If they always use kubectl over the console,
  that's a pattern. Emit it.

  OUTPUT FORMAT — strict JSON array. Nothing else, no prose, no markdown fences.

  [
    {
      "pattern_kind": "snake_case_category_of_the_pattern",
      "subject": "the concrete thing that recurs (e.g. 'nudgebee', 'us-east-1', 'cost-server')",
      "description": "ONE plain-English sentence the UI surfaces verbatim, explaining what the user habitually does",
      "agent_module": "finops | observability | k8s_ops | cloud_ops | automation | generic",
      "observations": 0
    }
  ]

  FIELD RULES:
  - pattern_kind: snake_case. Reuse a stable name when the same kind of pattern
    applies in different domains. Examples (NOT exhaustive — you may emit
    others):
      frequent_namespace, frequent_service, frequent_resource_type,
      frequent_cluster, frequent_region, frequent_cloud_account,
      frequent_alert, frequent_log_source, frequent_metric_dashboard,
      preferred_diagnostic_flow, preferred_observability_tool,
      preferred_cli_tool, repeated_cost_dimension, repeated_runbook_step,
      accepted_recommendation, dismissed_recommendation.
    When none of these fit, invent a new snake_case kind that names the
    category — never leave this blank.
  - subject: the concrete identifier the user keeps targeting. Lowercase. Just
    the value, not the question text. Examples: "nudgebee", "payments-api",
    "us-east-1", "prod-billing-aws", "loki", "kubectl_logs".
  - description: ONE sentence the user could read on a Settings page and
    immediately recognise. Tense: present habitual ("Frequently investigates
    payments-api in the prod cluster" / "Prefers Loki for log searches").
  - agent_module: the sub-system the pattern belongs to. Pick the closest of:
    finops, observability, k8s_ops, cloud_ops, automation, generic.
    Use "generic" only when the pattern truly spans modules.
  - observations: integer count of distinct turns / conversations where you
    observed the pattern. 1 is not allowed — patterns are by definition
    recurring. Minimum 2. If a pattern only appeared once, do NOT emit it.

  RECURRENCE THRESHOLD:
  - Only emit a pattern if you can point to AT LEAST TWO distinct turns or
    conversations where it shows up. A single instance is a transient
    observation, not a pattern.
  - Prefer fewer, higher-confidence patterns over many speculative ones. If the
    signal is weak, omit.

  EXCLUDE:
  - Transient values (current pod counts, today's error rate, a one-shot
    timestamp).
  - Generic ops behaviour anyone does ("checked pod status").
  - Speculation. Emit only what is directly evidenced in the transcript.
  - Anything already in EXISTING PATTERNS (you'll be told what's there).

  If nothing meets the recurrence threshold, return an empty array: []
