[tool.poetry]
name = "k8s-scaling"
version = "0.1.0"
description = ""
authors = ["Nudgebee <dev@nudgebee.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
python-dotenv = "^1.0.0"
flask = "^3.1.3"
prometheus-api-client = ">=0.5.4,<0.8.0"
pandas = "^2.1.4"
numpy = "^1.26.2"
gunicorn = "23.0.0"

# stubs
boto3-stubs = "1.43.67"
pandas-stubs = "2.0.3.230814"
types-tensorflow = "2.18.0.20260724"
sqlalchemy-stubs = "0.4"
types-requests = "2.33.0.20260503"
python-json-logger = "^2.0.7"
boto3 = "^1.34.53"
sqlalchemy = "^2.0.27"
psycopg2-binary = "^2.9.9"
keras = "^3.10.0"
tensorflow = "^2.20.0"
scikit-learn = "^1.4.1.post1"

opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.40.0"
opentelemetry-exporter-otlp = "^1.27.0"
opentelemetry-instrumentation-system-metrics = "^0.61b0"
opentelemetry-instrumentation-flask = "^0.61b0"
opentelemetry-instrumentation-requests = "^0.61b0"
pydantic = "^2.10.3"
kombu = "^5.4.2"
kubernetes = ">=26.1,<37.0"

# --- Universal data scrubbing (Tier-2 NER; Tier-1 regex needs no deps) ---
presidio-analyzer = ">=2.2.355"
spacy = ">=3.8,<3.9"
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# Security: pin patched versions of otherwise-transitive deps flagged by the
# image scan (pulled in via boto3 / tensorflow / packaging tooling). These
# floors don't change functionality; they just keep the resolved graph off the
# vulnerable releases.
urllib3 = ">=2.7.0"
cryptography = ">=48.0.1"
Brotli = ">=1.2.0"
"jaraco.context" = ">=6.1.0"
wheel = ">=0.46.2"
msgpack = ">=1.2.1"
# setuptools floor 83.0.0 for CVE-2026-59890. The old `<81` cap guarded a boot
# crash ("No module named 'pkg_resources'") caused by
# opentelemetry-instrumentation-system-metrics 0.48b0 importing pkg_resources at
# startup; contrib dropped that import in 0.50b0 and this service runs 0.61b0,
# so the cap no longer applies. Re-verify no installed package imports
# pkg_resources unguarded before lowering this floor.
setuptools = ">=83"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
pre-commit = "4.6.1"
black = "26.5.1"
mypy = "1.5.1"
flake8 = "7.3.0"


[tool.poetry.group.extras.dependencies]
pulp = "2.8.0"

[tool.mypy]
namespace_packages = true

[tool.black]
line-length = 120
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | \.ml-env
  | _build
  | buck-out
  | build
  | dist
  | notebooks
)/
'''

[tool.pytest.ini_options]
markers = [
    "benchmark: timing benchmark; deselected by default (run with -m benchmark)",
]
# Benchmarks are informational and slower (NER model load); keep them out of
# the default/CI run. Opt in explicitly with: pytest -m benchmark
addopts = "-m 'not benchmark'"
